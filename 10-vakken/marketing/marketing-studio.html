<title>Marketing Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: app-shell. Vaste zijbalk links op desktop, tabbalk onderin op mobiel; de inhoud staat in één kolom van max 980px.
   Beeld: studieboek met markeerstift. Kobaltblauw als actiekleur, geel alleen als markeerstreep onder kernwoorden. */
:root {
  --bg: #F3F4F9; --surface: #FFFFFF; --sunk: #E9ECF5; --line: #D9DDEA; --line-strong: #B9C0D6;
  --ink: #131729; --ink-2: #454C69; --ink-3: #6E7591;
  --accent: #2D47F0; --accent-hover: #1F36D1; --accent-ink: #FFFFFF; --accent-soft: #E2E7FF; --accent-text: #2238D6;
  --mark-bg: rgba(255, 222, 66, .9);
  --good: #157F50; --good-soft: #DDF3E8; --warn: #A86400; --warn-soft: #FDEFD6; --bad: #C42F45; --bad-soft: #FBE1E5;
  --shadow: 0 1px 2px rgba(19, 23, 41, .05), 0 10px 28px -14px rgba(19, 23, 41, .22);
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r-card: 16px; --r-ctl: 10px; --inv-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1020; --surface: #151A2D; --sunk: #1B2136; --line: #283050; --line-strong: #3A4470;
    --ink: #ECEEF8; --ink-2: #B4BAD3; --ink-3: #8A91B0;
    --accent: #8196FF; --accent-hover: #9AABFF; --accent-ink: #0D1020; --accent-soft: #1F2752; --accent-text: #A9B6FF;
    --mark-bg: rgba(233, 200, 58, .36);
    --good: #4CC98E; --good-soft: #12362A; --warn: #F0B44C; --warn-soft: #3A2B10; --bad: #FF7A8C; --bad-soft: #3E1820;
    --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 12px 30px -14px rgba(0, 0, 0, .7); --inv-scheme: light;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1020; --surface: #151A2D; --sunk: #1B2136; --line: #283050; --line-strong: #3A4470;
  --ink: #ECEEF8; --ink-2: #B4BAD3; --ink-3: #8A91B0;
  --accent: #8196FF; --accent-hover: #9AABFF; --accent-ink: #0D1020; --accent-soft: #1F2752; --accent-text: #A9B6FF;
  --mark-bg: rgba(233, 200, 58, .36);
  --good: #4CC98E; --good-soft: #12362A; --warn: #F0B44C; --warn-soft: #3A2B10; --bad: #FF7A8C; --bad-soft: #3E1820;
  --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 12px 30px -14px rgba(0, 0, 0, .7); --inv-scheme: light;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
button, input, textarea, select { font: inherit; color: inherit; }
a { color: var(--accent-text); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, h4 { font-family: var(--f-display); text-wrap: balance; margin: 0; letter-spacing: -.01em; }
p { margin: 0; }

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: 252px minmax(0, 1fr); min-height: 100%; }
.side { position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; height: 100dvh; display: flex; flex-direction: column; gap: 22px; padding: 22px 16px; border-right: 1px solid var(--line); background: var(--surface); }
.brand { display: flex; align-items: center; gap: 10px; padding: 2px 8px; }
.brand-mark { width: 34px; height: 34px; border-radius: 9px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; font-size: 17px; }
.brand b { font-family: var(--f-display); font-weight: 800; font-size: 18px; letter-spacing: -.02em; display: block; line-height: 1.1; }
.brand small { font-family: var(--f-mono); font-size: 11px; color: var(--ink-3); letter-spacing: .04em; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav button { display: flex; align-items: center; gap: 12px; padding: 9px 12px; border: 0; background: none; border-radius: var(--r-ctl); cursor: pointer; text-align: left; color: var(--ink-2); font-weight: 600; }
.nav button:hover { background: var(--sunk); color: var(--ink); }
.nav button[aria-current="page"] { background: var(--accent-soft); color: var(--accent-text); }
.nav svg, .tabbar svg { width: 20px; height: 20px; flex: none; }
.side-foot { margin-top: auto; display: grid; gap: 10px; }
.mini { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; background: var(--bg); }
.mini .eyebrow { margin-bottom: 2px; }
.mini b { font-family: var(--f-display); font-size: 22px; font-weight: 800; }
.mtop .theme-tg { min-width: 180px; }
.theme-tg { display: flex; gap: 4px; padding: 3px; border: 1px solid var(--line); border-radius: 999px; background: var(--bg); }
.theme-tg button { flex: 1; border: 0; background: none; padding: 5px 0; border-radius: 999px; font-size: 12px; font-weight: 600; color: var(--ink-3); cursor: pointer; }
.theme-tg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }

.main { min-width: 0; }
.page { max-width: 980px; margin: 0 auto; padding-inline: clamp(16px, 4vw, 44px); padding-block: 32px 110px; display: grid; gap: 30px; }
.tabbar { display: none; }

@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { display: none; }
  .page { padding-block: 20px calc(96px + env(safe-area-inset-bottom, 0px)); gap: 24px; }
  .tabbar { display: grid; grid-template-columns: repeat(6, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line); padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px)); }
  .tabbar button { display: grid; justify-items: center; gap: 2px; border: 0; background: none; padding: 6px 0 4px; color: var(--ink-3); font-size: 11px; font-weight: 600; cursor: pointer; border-radius: 10px; }
  .tabbar button[aria-current="page"] { color: var(--accent-text); }
  .tabbar button[aria-current="page"] svg { background: var(--accent-soft); border-radius: 999px; padding: 2px 10px; width: 42px; height: 24px; }
  .mtop { display: flex !important; }
}
.mtop { display: none; align-items: center; justify-content: space-between; gap: 12px; }

/* ---------- type ---------- */
.eyebrow { font-family: var(--f-mono); font-size: 11.5px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.title { font-size: clamp(30px, 5.2vw, 46px); font-weight: 800; line-height: 1.04; letter-spacing: -.025em; }
.hl { background-image: linear-gradient(transparent 60%, var(--mark-bg) 60%, var(--mark-bg) 90%, transparent 90%); padding: 0 .08em; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.lead { color: var(--ink-2); font-size: 16px; max-width: 62ch; }
.h2 { font-size: 21px; font-weight: 700; }
.h3 { font-size: 17px; font-weight: 700; }
.muted { color: var(--ink-3); }
.mono { font-family: var(--f-mono); }
.num { font-variant-numeric: tabular-nums; }
.sec { display: grid; gap: 14px; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.head { display: grid; gap: 10px; }

/* ---------- controls ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 8px 16px; border-radius: var(--r-ctl); border: 1px solid transparent; background: var(--accent); color: var(--accent-ink); font-weight: 600; cursor: pointer; text-decoration: none; white-space: nowrap; }
.btn:hover { background: var(--accent-hover); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.ghost { background: var(--surface); color: var(--ink); border-color: var(--line-strong); }
.btn.ghost:hover { background: var(--sunk); }
.btn.soft { background: var(--accent-soft); color: var(--accent-text); }
.btn.soft:hover { background: var(--accent-soft); filter: brightness(.97); }
.btn.sm { min-height: 32px; padding: 4px 12px; font-size: 13.5px; }
.btn.danger { background: var(--bad-soft); color: var(--bad); }
.btn svg { width: 17px; height: 17px; flex: none; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.tabs { display: flex; gap: 4px; padding: 4px; background: var(--sunk); border-radius: 12px; overflow-x: auto; scrollbar-width: none; max-width: 100%; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { border: 0; background: none; padding: 7px 14px; border-radius: 9px; font-weight: 600; color: var(--ink-2); cursor: pointer; white-space: nowrap; }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 999px; padding: 4px 11px; font-size: 13px; font-weight: 600; color: var(--ink-2); cursor: pointer; font-family: var(--f-mono); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.field { display: grid; gap: 6px; }
.field label, .lbl { font-weight: 600; font-size: 14px; }
.input, textarea.input, select.input { width: 100%; border: 1px solid var(--line-strong); background: var(--surface); border-radius: var(--r-ctl); padding: 10px 12px; }
textarea.input { min-height: 96px; resize: vertical; line-height: 1.5; }
.input:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }

/* ---------- cards ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); padding: 18px 20px; min-width: 0; }
.card.pad-lg { padding: 22px 24px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 720px) { .grid2, .grid3 { grid-template-columns: minmax(0, 1fr); } }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 700; white-space: nowrap; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.s0 { background: var(--sunk); color: var(--ink-3); }
.s1 { background: var(--warn-soft); color: var(--warn); }
.s2 { background: var(--good-soft); color: var(--good); }

/* hero */
.hero { display: grid; gap: 18px; }
.hero-grid { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 14px; }
@media (max-width: 720px) { .hero-grid { grid-template-columns: minmax(0, 1fr); } }
.count { display: grid; gap: 10px; align-content: start; background: var(--ink); color: var(--bg); border: 0; }
.count .eyebrow { color: color-mix(in srgb, var(--bg) 65%, transparent); }
.count-big { font-family: var(--f-display); font-weight: 800; font-size: clamp(54px, 9vw, 84px); line-height: .9; letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
.count-big small { font-size: .32em; letter-spacing: 0; font-weight: 700; margin-left: 6px; }
.count .input { background: transparent; color: var(--bg); border-color: color-mix(in srgb, var(--bg) 40%, transparent); color-scheme: var(--inv-scheme); }
.count .btn.ghost { background: transparent; color: var(--bg); border-color: color-mix(in srgb, var(--bg) 40%, transparent); }
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.fact { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: grid; gap: 2px; }
.fact b { font-family: var(--f-display); font-size: 20px; font-weight: 700; }
.fact span { font-size: 13px; color: var(--ink-3); }

/* next step */
.next { display: flex; gap: 16px; align-items: center; justify-content: space-between; flex-wrap: wrap; border-left: 4px solid var(--accent); }
.next .t { display: grid; gap: 4px; min-width: 0; flex: 1 1 280px; }

/* weeks */
.wgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.wtile { display: grid; gap: 6px; text-align: left; padding: 12px 14px 14px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); cursor: pointer; min-width: 0; }
.wtile:hover { border-color: var(--line-strong); box-shadow: var(--shadow); }
.wnum { font-family: var(--f-mono); font-weight: 600; font-size: 13px; color: var(--ink-3); display: flex; justify-content: space-between; align-items: center; }
.wt { font-weight: 700; line-height: 1.25; font-size: 14.5px; min-height: 2.5em; hyphens: auto; -webkit-hyphens: auto; overflow-wrap: anywhere; }
.bar { height: 6px; border-radius: 99px; background: var(--sunk); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.dot { width: 9px; height: 9px; border-radius: 50%; }
.dot.s0 { background: var(--line-strong); } .dot.s1 { background: var(--warn); } .dot.s2 { background: var(--good); }

.wlist { display: grid; gap: 10px; }
.wrow { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 16px; align-items: center; text-align: left; padding: 14px 18px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); cursor: pointer; }
.wrow:hover { border-color: var(--line-strong); box-shadow: var(--shadow); }
.wrow .big { font-family: var(--f-display); font-weight: 800; font-size: 30px; letter-spacing: -.03em; color: var(--accent-text); font-variant-numeric: tabular-nums; }
.wrow .meta { display: grid; gap: 3px; min-width: 0; }
.wrow .side-r { display: grid; gap: 6px; justify-items: end; min-width: 90px; }
@media (max-width: 560px) { .wrow { grid-template-columns: 48px minmax(0, 1fr); } .wrow .side-r { grid-column: 2; justify-items: start; } .wrow .big { font-size: 24px; } }

/* actions grid */
.acts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 720px) { .acts { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.act { display: grid; gap: 6px; align-content: start; text-align: left; padding: 14px 16px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); cursor: pointer; min-width: 0; }
.act:hover { border-color: var(--accent); }
.act svg { width: 22px; height: 22px; color: var(--accent-text); }
.act b { font-weight: 700; }
.act span { font-size: 13px; color: var(--ink-3); line-height: 1.4; }

/* leerdoelen */
.ld { display: grid; gap: 8px; counter-reset: ld; padding: 0; margin: 0; list-style: none; }
.ld li { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 12px; align-items: start; padding: 10px 0; border-bottom: 1px solid var(--line); }
.ld li:last-child { border-bottom: 0; }
.ld .n { font-family: var(--f-mono); font-weight: 600; color: var(--ink-3); padding-top: 1px; }
.ld .links { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.lwlink { font-family: var(--f-mono); font-size: 12px; font-weight: 600; border: 0; background: var(--sunk); color: var(--ink-2); padding: 2px 8px; border-radius: 6px; cursor: pointer; }
.lwlink:hover { background: var(--accent-soft); color: var(--accent-text); }

/* week page */
.wk-head { display: grid; gap: 12px; }
.back { justify-self: start; border: 0; background: none; color: var(--ink-3); font-weight: 600; cursor: pointer; padding: 0; display: inline-flex; gap: 6px; align-items: center; }
.back:hover { color: var(--ink); }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 999px; padding: 3px; gap: 2px; background: var(--surface); }
.seg button { border: 0; background: none; border-radius: 999px; padding: 5px 12px; font-size: 13px; font-weight: 700; cursor: pointer; color: var(--ink-3); }
.seg button[aria-pressed="true"].v0 { background: var(--sunk); color: var(--ink); }
.seg button[aria-pressed="true"].v1 { background: var(--warn-soft); color: var(--warn); }
.seg button[aria-pressed="true"].v2 { background: var(--good-soft); color: var(--good); }
.kern { display: grid; gap: 12px; }
.kern .card h3 { font-size: 17px; margin-bottom: 8px; }
.goals { margin: 0; padding-left: 20px; display: grid; gap: 4px; color: var(--ink-2); }
.stelling { border-left: 4px solid var(--warn); }
.dq { display: grid; gap: 8px; }
.dq-item { display: grid; gap: 8px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.dq-item:last-child { border-bottom: 0; }
.dq-item .q { display: flex; gap: 12px; justify-content: space-between; align-items: start; }
.slides { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
.slide { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; background: var(--surface); font-size: 14px; display: grid; gap: 4px; align-content: start; }
.slide .eyebrow { font-size: 10.5px; }
.slide ul { margin: 0; padding-left: 18px; color: var(--ink-2); }

/* glossary */
.gl { display: grid; gap: 0; }
.gl-item { display: grid; grid-template-columns: minmax(150px, 230px) minmax(0, 1fr); gap: 4px 18px; padding: 11px 0; border-bottom: 1px solid var(--line); }
.gl-item dt { font-weight: 700; }
.gl-item dd { margin: 0; color: var(--ink-2); }
.gl-item .w { font-family: var(--f-mono); font-size: 11.5px; color: var(--ink-3); font-weight: 500; margin-left: 6px; }
@media (max-width: 560px) { .gl-item { grid-template-columns: minmax(0, 1fr); } }

/* flashcards */
.fc-wrap { display: grid; gap: 14px; justify-items: center; }
.fc { width: 100%; max-width: 620px; min-height: 260px; perspective: 1400px; cursor: pointer; border: 0; background: none; padding: 0; }
.fc-inner { display: block; position: relative; width: 100%; min-height: 260px; transition: transform .45s cubic-bezier(.2, .7, .2, 1); transform-style: preserve-3d; }
.fc.flip .fc-inner { transform: rotateY(180deg); }
.fc-face { position: absolute; inset: 0; display: grid; place-items: center; align-content: center; gap: 12px; padding: 28px; border-radius: 20px; backface-visibility: hidden; -webkit-backface-visibility: hidden; border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow); text-align: center; }
.fc-face.back { transform: rotateY(180deg); background: var(--accent-soft); border-color: transparent; }
.fc-term, .fc-def, .fc-hint { display: block; }
.fc-term { font-family: var(--f-display); font-size: clamp(24px, 4.4vw, 34px); font-weight: 800; letter-spacing: -.02em; line-height: 1.1; }
.fc-def { font-size: 17px; line-height: 1.5; max-width: 46ch; color: var(--ink); }
.fc-hint { font-size: 12.5px; color: var(--ink-3); }
.fc-btns { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; width: 100%; max-width: 620px; }
.fc-btns .b0 { background: var(--bad-soft); color: var(--bad); }
.fc-btns .b1 { background: var(--warn-soft); color: var(--warn); }
.fc-btns .b2 { background: var(--good-soft); color: var(--good); }
.fc-stats { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; font-size: 13px; color: var(--ink-3); }

/* quiz */
.qz { display: grid; gap: 14px; max-width: 720px; }
.qz-q { font-family: var(--f-display); font-size: clamp(19px, 3vw, 23px); font-weight: 700; line-height: 1.25; }
.opts { display: grid; gap: 8px; }
.opt { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; align-items: center; text-align: left; padding: 12px 14px; border: 1px solid var(--line-strong); background: var(--surface); border-radius: 12px; cursor: pointer; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt .k { font-family: var(--f-mono); font-weight: 600; width: 26px; height: 26px; display: grid; place-items: center; border-radius: 7px; background: var(--sunk); font-size: 13px; }
.opt.ok { border-color: var(--good); background: var(--good-soft); }
.opt.ok .k { background: var(--good); color: var(--surface); }
.opt.no { border-color: var(--bad); background: var(--bad-soft); }
.opt.no .k { background: var(--bad); color: var(--surface); }
.opt:disabled { cursor: default; }
.qz-fb { padding: 12px 14px; border-radius: 12px; background: var(--sunk); }
.progress { display: flex; gap: 4px; }
.progress i { flex: 1; height: 5px; border-radius: 9px; background: var(--sunk); }
.progress i.ok { background: var(--good); } .progress i.no { background: var(--bad); } .progress i.cur { background: var(--accent); }
.tag { font-family: var(--f-mono); font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 6px; background: var(--sunk); color: var(--ink-3); }

/* cases */
.cases { display: grid; gap: 10px; }
.case-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px; align-items: center; text-align: left; padding: 14px 18px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); cursor: pointer; }
.case-row:hover { border-color: var(--line-strong); box-shadow: var(--shadow); }
.case-row .t { display: grid; gap: 4px; min-width: 0; }
.case-row b { font-weight: 700; }

in je studie of werk?","Vul de lesenquête in via de QR-code.[toevoegen docent]","Bedankt voor jullie inzet en enthousiasme!"]}],"handouts":[]}},"plan":"Marketingplan GreenRide\n\n1. Managementsamenvatting\n\nGreenRide is een start-up die elektrische deelfietsen aanbiedt in een middelgrote Nederlandse studentenstad. Via een gebruiksvriendelijke app kunnen studenten en werkenden eenvoudig een elektrische fiets huren voor korte stedelijke verplaatsingen.\n\nDe markt biedt kansen door de groeiende behoefte aan duurzaam vervoer, de drukte in binnensteden en de populariteit van deelmobiliteit. Tegelijkertijd heeft GreenRide te maken met concurrentie van openbaar vervoer, reguliere fietsen, e-bikes en andere aanbieders van deelmobiliteit.\n\nDe marketingstrategie richt zich daarom op <vul in>. GreenRide wil zich positioneren als <vul in>.\n\nDe belangrijkste marketingdoelstelling voor het eerste jaar is <vul in>.\n\n2. Situatieanalyse\n\nInterne analyse\n\nSterktes\n\nDuurzaam alternatief voor auto en scooter.\n\nElektrische fietsen maken langere afstanden gemakkelijk.\n\nGebruik via één app is eenvoudig.\n\nFlexibel: fietsen zijn beschikbaar wanneer de gebruiker ze nodig heeft.\n\nSterke aansluiting bij de waarden van studenten en duurzaamheidsbewuste consumenten.\n\nZwaktes\n\nHoge investeringskosten voor fietsen en laad-/onderhoudsinfrastructuur.\n\nStart-up heeft nog weinig naamsbekendheid.\n\nBeschikbaarheid van fietsen moet voldoende hoog zijn.\n\nVandalisme, diefstal en onderhoud kunnen de kosten verhogen.\n\nAfhankelijkheid van een goed werkende app.\n\nExterne analyse\n\nKansen\n\nToenemende aandacht voor duurzame mobiliteit.\n\nGroei van steden en stedelijke mobiliteitsproblemen.\n\nStudenten zijn gewend aan app-based services.\n\nMogelijkheden voor samenwerking met onderwijsinstellingen en werkgevers.\n\nToenemende behoefte aan flexibele vervoersoplossingen.\n\nBedreigingen\n\nConcurrentie van OV, eigen fietsen en e-bikes.\n\nAndere aanbieders van deelmobiliteit.\n\nGemeentelijke regelgeving.\n\nPrijsgevoeligheid van studenten.\n\nNegatieve ervaringen met slecht onderhouden of niet-beschikbare deelfietsen.\n\n3. Doelgroep\n\nDe primaire doelgroep bestaat uit studenten en werkenden van 18-45 jaar die regelmatig korte afstanden binnen de stad afleggen.\n\nSegmenten\n\nSegment\n\nBehoefte\n\nMarketingbenadering\n\nStudenten\n\nGoedkoop, snel en flexibel vervoer\n\nStudentenkorting, referral en social media\n\nJonge werkenden\n\nSnel naar werk, station of afspraak\n\nGemak, snelheid en abonnementen\n\nDuurzaamheidsbewuste gebruikers\n\nMilieuvriendelijk vervoer\n\nDuurzaamheidscommunicatie\n\nIncidentele gebruikers\n\nFlexibel vervoer zonder bezit\n\nPay-as-you-go en eenvoudige registratie\n\nPrimaire doelgroep: <vul in>.\n\n4. Positionering\n\nGreenRide positioneert zich als:\n\nDe makkelijke, duurzame en betaalbare manier om je snel door de stad te verplaatsen.\n\nDe positionering onderscheidt GreenRide van het openbaar vervoer door flexibiliteit en van een gewone fiets door elektrische ondersteuning en beschikbaarheid zonder bezit.\n\nMogelijke pay-off (zoals \"Red Bull geeft je vleugels\" of L'Oréal's \"Omdat ik het waard ben\"): <vul in>.\n\n5. Marketingdoelstellingen\n\nDe doelstellingen zijn SMART geformuleerd.\n\nEerste 12 maanden\n\n<vul in> geregistreerde gebruikers realiseren binnen 12 maanden.\n\nMinimaal 4.000 actieve maandelijkse gebruikers bereiken aan het einde van jaar 1.\n\nEen gemiddelde klantwaardering van minimaal <vul in> realiseren.\n\nMinimaal 30% van de nieuwe klanten via aanbevelingen/referrals laten komen.\n\nEen herhaalgebruik van minimaal <vul in> % realiseren binnen drie maanden na de eerste rit.\n\n6. Marketingstrategie: 4 P's\n\nProduct\n\nGreenRide biedt elektrische deelfietsen die gebruikers via een mobiele app kunnen vinden, reserveren, ontgrendelen en betalen.\n\nBelangrijke productelementen (bv. app voor reserveren en betalen):\n\n<vul in>.\n\nExtra service: GreenRide kan abonnementen aanbieden voor frequente gebruikers.\n\nPrijs\n\nGreenRide hanteert een laagdrempelig pay-as-you-go-model, eventueel aangevuld met abonnementen.\n\nBijvoorbeeld:\n\nStarttarief: <vul in>\n\nGebruik: <vul in> per minuut\n\nDagpas voor intensieve gebruikers\n\nStudententarief\n\nMaandabonnement voor frequente gebruikers\n\nDe prijsstrategie is vooral gericht op waarde voor de klant: de gebruiker betaalt voor het gebruik van de fiets en hoeft geen fiets aan te schaffen, te onderhouden of te stallen.\n\nPlaats (distributie)\n\nDe fietsen worden geplaatst op locaties waar veel potentiële gebruikers komen:\n\nTreinstation\n\nHogescholen en universiteiten\n\nStudentencomplexen\n\nBinnenstad\n\nWinkelgebieden\n\nKantoren en bedrijventerreinen\n\nBelangrijke OV-knooppunten\n\nHet succes van GreenRide is sterk afhankelijk van beschikbaarheid op de juiste locatie en het juiste moment.\n\nPromotie\n\nDe promotiestrategie richt zich vooral op digitale kanalen en lokale partnerships.\n\nOnline\n\n<vul channels in>\n\nOffline\n\n<vul in>\n\nSales promotion\n\n<vul in>\n\nDaarnaast:\n\n\"Nodig een vriend uit en ontvang €5 GreenRide-tegoed.\"\n\nDit stimuleert zowel acquisitie als referral marketing.\n\n7. Customer journey\n\nAIDA\n\nKlantgedrag\n\nGreenRide-actie\n\nAttention\n\nZiet GreenRide op social media\n\n<vul in>\n\nInterest\n\nBekijkt app, website en prijzen\n\n<vul in>\n\nDesire\n\nVergelijkt GreenRide met OV/fiets en raakt overtuigd\n\n<vul in>\n\nAction\n\nDownloadt de app en maakt een eerste rit\n\n<vul in>\n\n8. Communicatiestrategie\n\nDe centrale boodschap is:\n\n\"Pak een GreenRide. Stap op. En ga.\"\n\nDe communicatie legt vooral de nadruk op drie voordelen:\n\n1. Gemakkelijk\nGeen fiets kopen, onderhouden of stallen.\n\n2. Snel\nDirect vertrekken wanneer jij wilt.\n\n3. Duurzaam\nEen alternatief voor auto en scooter.\n\nDe communicatiestijl is <vul in>.\n\n9. SWOT\n\nPositief\n\nNegatief\n\nIntern\n\nStrengths: <vul in>\n\nWeaknesses: <vul in>\n\nExtern\n\nOpportunities: <vul in>\n\nThreats: <vul in>\n\nStrategische conclusie\n\nGreenRide moet vooral de combinatie van duurzaamheid + gemak + flexibiliteit benutten. De belangrijkste uitdaging is om voldoende fietsen beschikbaar te hebben op plaatsen en momenten waarop de doelgroep ze nodig heeft.\n\n10. KPI's\n\nOm het marketingplan te controleren worden onder andere de volgende KPI's gebruikt:\n\nDoel\n\nKPI\n\nNaamsbekendheid\n\nBrand awareness\n\nNieuwe klanten\n\n<vul in>\n\nAppgebruik\n\nDownloads en actieve gebruikers\n\nGebruik\n\n<vul in>\n\nLoyaliteit\n\n<vul in>\n\nTevredenheid\n\n<vul in>\n\nSocial media\n\n<vul in>\n\nMarketingefficiëntie\n\nMarketing-ROI\n\nOmzet\n\nOmzet per gebruiker\n\nReferral\n\nPercentage klanten via aanbevelingen\n\n11. Implementatieplan\n\nMaand 1-3: Lancering\n\nApp en fietsen introduceren.\n\nSocialmediacampagne starten.\n\nSamenwerkingen met onderwijsinstellingen.\n\nEerste-rit-gratisactie.\n\nPromotie tijdens introductieactiviteiten.\n\nMaand 4-6: Groei\n\nReferralprogramma introduceren.\n\nGoogle en social advertising optimaliseren.\n\nMeer fietsen plaatsen op succesvolle locaties.\n\nStudentenabonnement introduceren.\n\nMaand 7-9: Retentie\n\n<vul in>\n\n<vul in>\n\n<vul in>\n\nAnalyse van gebruikspatronen.\n\nMaand 10-12: Optimalisatie\n\nMarketing-ROI analyseren.\n\nBeste klantsegmenten identificeren.\n\nPrijsstrategie evalueren.\n\nLocaties met lage bezettingsgraad aanpassen.\n\nMarketingplan voor jaar 2 opstellen."};

{ n: 1, titel: "Introductie marketing", sub: "Marketingbegrippen, klantwaarde en de marketingmix", boek: "H1 Understanding Marketing",
  lesdoelen: ["Benoemen wat marketing inhoudt en welke rol marketing speelt binnen organisaties.", "Herkennen welke kernbegrippen centraal staan binnen marketing, zoals klantwaarde, behoefte, aanbod en markt.", "Beschrijven hoe marketing bijdraagt aan het creëren van klantwaarde.", "Benoemen welke invloed digitalisering en Industry 4.0 hebben op marketingactiviteiten."],
  kern: [
    { kop: "Wat is marketing?", md: "Marketing is **waarde creëren, communiceren en leveren** aan klanten, zo dat klant én organisatie er beter van worden.\n\n- **Klantbehoeften zijn het vertrekpunt**: eerst snappen wat de klant nodig heeft, dan pas een aanbod maken.\n- **Ruil** is de kern: beide partijen geven iets van waarde (geld tegen een product of dienst).\n- **Marketing ≠ verkoop.** Verkoop wil bestaande producten kwijt (korte termijn). Marketing begint bij de klantbehoefte en is strategisch (lange termijn).\n- **Marketing ≠ reclame.** Reclame is maar één instrument, onderdeel van de P van Promotie.\n- Marketing heeft ook een **maatschappelijke rol**: het beïnvloedt wat mensen kopen, welvaart en duurzaamheid." },
    { kop: "Marketing in beweging: de oriëntaties", md: "1. **Productie-oriëntatie**: focus op efficiënt en goedkoop produceren. \"Ons product is zo goed dat het zichzelf verkoopt\" past bij deze productgerichte denkwijze.\n2. **Verkoop-oriëntatie**: focus op afzet, hard verkopen.\n3. **Marketing-oriëntatie**: focus op klantbehoeften; eerst onderzoeken wat de klant wil.\n4. **Maatschappelijke marketing-oriëntatie**: klantbehoeften én het welzijn van de samenleving op lange termijn.\n5. **Digitale marketing**: data, personalisatie en platforms." },
    { kop: "Kernbegrippen", md: "- **Behoefte**: een basaal tekort (honger, veiligheid). **Wens**: de vorm die een behoefte krijgt door cultuur en persoon (een burger). **Vraag**: een wens met koopkracht erachter.\n- **Klantwaarde = voordelen − kosten**, zoals de klant die ervaart.\n- **Klanttevredenheid**: de prestatie is gelijk aan of beter dan de verwachting.\n- **Aanbod**: product, dienst of ervaring.\n- **Markt**: alle (potentiële) kopers. **Doelgroep**: het deel van de markt waar je je op richt.\n- **Marketingomgeving**: alle factoren om de organisatie heen die marketing beïnvloeden (zie LW03)." },
    { kop: "Rol van marketing in de organisatie", md: "- Marketing is een **strategische functie** en werkt samen met andere bedrijfsfuncties (verkoop, productontwikkeling, financiën, HR, operations).\n- **Klantgerichtheid**: de hele organisatie denkt vanuit de klant. Een **productgerichte** organisatie denkt vanuit wat ze maakt.\n- **Interne marketing** richt zich op de eigen medewerkers, **externe marketing** op klanten.\n- Ook **non-profitorganisaties** doen aan marketing, bijvoorbeeld om donateurs of vrijwilligers te werven." },
    { kop: "Klantwaarde en waardecreatie", md: "- Drie soorten waarde: **functioneel** (wat het doet), **emotioneel** (hoe het voelt), **sociaal** (wat het over jou zegt).\n- Voorbeeld iPhone: functioneel (camera, snelheid), emotioneel (design, gemak), sociaal (status). Daarom betalen mensen meer dan voor een goedkoper alternatief.\n- **Customer lifetime value (CLV)**: de totale waarde die een klant oplevert over de hele klantrelatie.\n- **Waardepropositie**: de belofte waarom de klant voor jou kiest. Ryanair: zo goedkoop mogelijk van A naar B, zonder extra's." },
    { kop: "De marketingmix", md: "- **4P's**: Product, Price (prijs), Place (distributie), Promotion (communicatie).\n- **7P's**: de 4P's plus **People, Process, Presence** (in veel boeken heet de 7e P *Physical evidence*). Vooral belangrijk voor **diensten**.\n- De P's moeten **samenhangen**: een premium product hoort bij een hogere prijs, selectieve verkooppunten en passende communicatie.\n- De marketingmix is het instrument om **waarde te creëren**. Digitalisering verandert elke P (apps, online prijzen, webshops, social media)." },
    { kop: "Digitalisering en marketing", md: "- **Industry 4.0**: digitalisering en automatisering (slimme apparaten, sensoren, koppelingen).\n- **Big data** levert klantinzichten op; **AI** maakt personalisatie, chatbots en voorspellingen mogelijk.\n- **Marketing convergence**: online en offline lopen in elkaar over (online bestellen, in de winkel ophalen).\n- Gevolg voor de marketeer: meer data-gedreven werken." }
  ],
  stelling: null },

{ n: 2, titel: "Koopgedrag en customer journey", sub: "Externe analyse: koopgedrag en Digital Customer Journey", boek: "H2 Understanding Buyers",
  lesdoelen: ["Uitleggen waarom inzicht in koopgedrag belangrijk is voor marketingbeslissingen.", "Beschrijven uit welke stappen het aankoopbeslissingsproces van consumenten bestaat.", "Uitleggen hoe klanten de digitale customer journey doorlopen.", "Herkennen waarin consumentengedrag en zakelijk koopgedrag van elkaar verschillen."],
  kern: [
    { kop: "Waarom buyer behavior telt", md: "- **Buyer behavior**: hoe en waarom klanten kopen. Inzicht hierin is de basis voor marketingbeslissingen.\n- Kopers beslissen **rationeel** (afwegen) of **irrationeel** (emotie, impuls). Een **impulsaankoop** is ongepland.\n- Koopgedrag wordt beïnvloed door omgeving, cultuur en sociale groepen." },
    { kop: "Consument (B2C) vs. zakelijke afnemer (B2B)", md: "| | B2C | B2B |\n|---|---|---|\n| Aantal kopers | veel | weinig |\n| Aankoopvolume | klein | groot |\n| Koopproces | snel, vaak emotioneel | lang, formeel, rationeel |\n| Wie beslist | één persoon of gezin | een **beslissingsunit (DMU)**: meerdere mensen |\n| Relatie | los | contracten, lange relaties |\n| Informatie | online, reviews | offertes, referenties, meerdere bronnen |\n\nB2B duurt langer omdat er meer mensen, meer geld en meer risico mee gemoeid zijn. Rationele productinformatie past daarom beter bij B2B dan emotionele reclame." },
    { kop: "Invloeden op koopgedrag", md: "- **Psychologisch**: motivatie, perceptie, leren, attitudes.\n- **Persoonlijk**: leeftijd, inkomen, levensstijl.\n- **Sociaal**: familie, vrienden, **referentiegroepen** (groepen waar je bij hoort of bij wilt horen).\n- **Cultureel**: waarden en normen.\n- **Situationeel**: tijd, locatie, stemming. Een supermarkt speelt hierop in met snacks bij de kassa en kant-en-klaarmaaltijden rond etenstijd." },
    { kop: "Het aankoopbeslissingsproces (5 stappen)", md: "1. **Behoefteherkenning**: door een **interne prikkel** (honger, vermoeidheid, verlangen) of **externe prikkel** (reclame, aanbeveling, trend).\n2. **Informatie zoeken**: **passief** (je staat open voor informatie) of **actief** (je zoekt bewust, bv. op Google of een vergelijkingssite). Hier speelt online zoeken de grootste rol.\n3. **Evaluatie van alternatieven**: op criteria als prijs, kwaliteit, merk en reviews. **Compensatorisch**: een zwak punt mag gecompenseerd worden door een sterk punt. **Niet-compensatorisch**: een harde eis; voldoet een optie niet, dan valt hij af.\n4. **Aankoopbeslissing**: anderen kunnen nog invloed hebben; online of offline kopen.\n5. **Gedrag na aankoop**: tevreden of niet. **Cognitieve dissonantie** is twijfel of spijt na de aankoop. De marketeer verkleint dit met bevestiging, garantie, goede service en klantcontact." },
    { kop: "Zero Moment of Truth (ZMOT)", md: "Het **ZMOT** is het moment waarop een consument **online informatie zoekt vóór de aankoop**: reviews, vergelijkingssites, social media, filmpjes. Daar valt de keuze vaak al. Marketeers zorgen daarom dat ze op dat moment goed vindbaar zijn, met goede reviews en duidelijke informatie.\n\nDe **betrouwbaarste bron** voor consumenten blijft de aanbeveling van vrienden en familie." },
    { kop: "Psychologie van koopgedrag", md: "- **Motivatie: piramide van Maslow** (van onder naar boven): fysiologische behoeften → veiligheid → sociale behoeften → waardering (erkenning, status) → zelfontplooiing. Een luxemerk richt zich vooral op **waardering**.\n- **Perceptie**: hoe consumenten informatie selecteren en interpreteren. Een negatieve perceptie buig je om met bewijs, ervaringen en consistente communicatie.\n- **Leren en gewoontevorming**, **attitudes en overtuigingen**, **persoonlijkheid en zelfconcept** (je koopt wat past bij wie je bent of wilt zijn)." },
    { kop: "Digital customer journey", md: "- De **customer journey** is de reis van de klant langs alle **touchpoints** (contactmomenten): advertentie, website, reviews, app, winkel, klantenservice, na-aankoop.\n- B2C: snel, emotioneel, online. B2B: formeel, rationeel, meerdere bronnen.\n- In B2C wegen **reviews** zwaar, in B2B **referenties** en cases.\n- **Omnichannel informatieverzameling**: de klant wisselt tussen kanalen (online kijken, in de winkel voelen, via de app kopen)." }
  ],
  stelling: "Online reviews zijn betrouwbaarder dan aanbevelingen van vrienden." },

{ n: 3, titel: "Omgevingsanalyse en SWOT", sub: "Interne analyse, externe analyse en SWOT", boek: "H5 Marketing Strategy",
  lesdoelen: ["Beschrijven welke interne en externe factoren invloed hebben op marketingbeleid en marketingactiviteiten.", "Uitleggen hoe organisaties hun interne en externe omgeving analyseren om marketingkansen en -bedreigingen te identificeren.", "Herkennen welke macro-, meso- en microfactoren van invloed zijn op marketingbeslissingen.", "Beschrijven hoe inzichten uit een interne en externe analyse worden vertaald naar een SWOT-analyse en eenvoudige marketingstrategie."],
  kern: [
    { kop: "De marketingomgeving: micro, meso en macro", md: "- **Micro-omgeving**: de organisatie zelf (middelen, medewerkers, cultuur). **Beheersbaar.**\n- **Meso-omgeving**: klanten, concurrenten, leveranciers, distributeurs. Deels te beïnvloeden.\n- **Macro-omgeving**: de grote trends, geanalyseerd met **PESTEL**. **Niet beheersbaar.**\n\nDe omgevingsanalyse is de basis voor de strategie. Bij een nieuw product wil je weten welke trends en regels je kansen vergroten of bedreigen." },
    { kop: "PESTEL (macro-omgeving)", md: "| Letter | Factor | Voorbeeld (GreenRide) |\n|---|---|---|\n| **P** | Political: overheidsbeleid | gemeente stimuleert duurzame mobiliteit |\n| **E** | Economic: conjunctuur, inkomen, koopkracht | studenten zijn prijsgevoelig |\n| **S** | Social: waarden, normen, levensstijl | jongeren vinden duurzaamheid en delen belangrijk |\n| **T** | Technological: innovaties, digitalisering | betere accu's, apps |\n| **E** | Ecological: duurzaamheid en milieu | CO₂-doelen, klimaat |\n| **L** | Legal: wetgeving | parkeerregels voor deelvoertuigen, AVG |\n\nDe **AVG** (privacywet) heeft digitale marketing veranderd: toestemming voor cookies en e-mail, zorgvuldig omgaan met klantdata." },
    { kop: "Meso-omgeving: concurrentie en stakeholders", md: "**Vijf krachten van Porter** (concurrentieanalyse van een bedrijfstak):\n1. Concurrentie tussen bestaande aanbieders\n2. Dreiging van nieuwe toetreders\n3. Dreiging van substituten (vervangende producten)\n4. Onderhandelingsmacht van afnemers\n5. Onderhandelingsmacht van leveranciers\n\n- **Directe concurrent**: zelfde soort product (GreenRide vs. Felyx en Check).\n- **Indirecte concurrent**: andere oplossing voor dezelfde behoefte (GreenRide vs. OV of een eigen fiets; bioscoop vs. Netflix).\n- Stakeholders: klanten, leveranciers, distributeurs en maatschappelijke partijen (gemeente, bewoners)." },
    { kop: "Interne analyse: sterktes en zwaktes", md: "- Wat kan de organisatie goed (**sterktes**: unieke competenties en middelen) en waarin is ze slecht (**zwaktes**: beperkingen)?\n- **Waardeketen van Porter**: in welke activiteiten maakt de organisatie waarde? Primair: inkomende logistiek, operaties, uitgaande logistiek, marketing en verkoop, service. Ondersteunend: infrastructuur, HRM, technologie, inkoop.\n- De interne analyse is input voor de SWOT. Een zwakte kun je soms omzetten door een kans te benutten (bv. weinig budget → gratis PR en social media)." },
    { kop: "De SWOT-analyse", md: "| | Helpend | Schadelijk |\n|---|---|---|\n| **Intern** (nu, beheersbaar) | **S**trengths | **W**eaknesses |\n| **Extern** (omgeving, niet beheersbaar) | **O**pportunities | **T**hreats |\n\n**Valkuil:** \"de vraag naar duurzame producten groeit\" is een **kans** (extern), geen sterkte. Een **zwakte** zit in de organisatie (klein budget), een **bedreiging** komt van buiten (nieuwe concurrent). Een bedreiging kan soms een kans worden als je er slim op inspeelt." },
    { kop: "De confrontatiematrix", md: "Je zet sterktes en zwaktes tegen kansen en bedreigingen:\n\n- **S×O offensief**: sterktes benutten om kansen te pakken.\n- **S×T defensief**: sterktes inzetten tegen bedreigingen.\n- **W×O groei/verbeteren**: zwaktes wegwerken om kansen te kunnen pakken.\n- **W×T terugtrekken**: zwaktes en bedreigingen vermijden; de gevaarlijkste positie (afbouwen, samenwerken of stoppen).\n\nDe meest aantrekkelijke richting is meestal **offensief (S×O)**." },
    { kop: "Van SWOT naar strategische keuzes", md: "**Generieke strategieën van Porter**\n- **Kostenleiderschap**: laagste kosten, dus lage prijs (Ryanair).\n- **Differentiatie**: uniek en meerwaarde, dus hogere prijs (Starbucks met de \"Third Place\"-ervaring).\n- **Focus**: richten op een niche, met lage kosten of met differentiatie.\n\n**Ansoff-matrix** (groeistrategieën)\n\n| | Bestaande producten | Nieuwe producten |\n|---|---|---|\n| **Bestaande markten** | Marktpenetratie | Productontwikkeling |\n| **Nieuwe markten** | Marktontwikkeling | Diversificatie (meeste risico) |\n\nVoorbeeld: een supermarkt die een bezorgservice start voor bestaande klanten = **productontwikkeling**.\n\nDaarna: **strategische doelen en KPI's**, en de lijn **SWOT → strategie → marketingmix**. Een **duurzaam concurrentievoordeel** is moeilijk na te doen." }
  ],
  stelling: "Een organisatie die kiest voor differentiatie heeft een sterkere concurrentiepositie dan een organisatie die kiest voor kostenleiderschap." },

{ n: 4, titel: "Segmentatie, targeting en positionering", sub: "STP", boek: "H3 Segmentation, Targeting and Positioning",
  lesdoelen: ["Uitleggen waarom organisaties markten segmenteren.", "Herkennen welke segmentatiecriteria gebruikt kunnen worden voor consumenten- en zakelijke markten.", "Toepassen hoe een organisatie een passende doelgroep kiest op basis van eenvoudige marktinformatie.", "Toepassen hoe een organisatie zich kan positioneren ten opzichte van concurrenten en klantbehoeften."],
  kern: [
    { kop: "De STP-aanpak", md: "1. **Segmentatie**: de markt opdelen in groepen.\n2. **Targeting**: kiezen op welke groep(en) je je richt.\n3. **Positionering**: bepalen welk beeld je in het hoofd van die doelgroep wilt hebben." },
    { kop: "Segmentatie: waarom en hoe?", md: "- **Segmentatie** = de markt opdelen in **homogene groepen** (binnen de groep vergelijkbaar, tussen groepen verschillend).\n- Waarom? **Efficiëntie** (budget gericht inzetten) en **effectiviteit** (beter aansluiten). Een sportschool segmenteert bv. in studenten, senioren en fanatieke sporters.\n- Eisen aan een goed segment: **meetbaar, groot genoeg (rendabel), bereikbaar, onderscheidend** (reageert anders op de mix).\n- Segmentatie kan in B2C en B2B (bv. naar branche of bedrijfsgrootte).\n- **Digitale segmentatie** is data-gedreven: op klikgedrag, locatie of aankoophistorie." },
    { kop: "Segmentatiecriteria", md: "| Criterium | Voorbeelden |\n|---|---|\n| **Demografisch** | leeftijd, geslacht, inkomen, opleiding |\n| **Geografisch** | land, regio, stad, klimaat |\n| **Psychografisch** | waarden, levensstijl, persoonlijkheid |\n| **Gedragsmatig** | koopfrequentie, merktrouw, gebruiksmoment, reden van gebruik |\n\n- **Multivariabele segmentatie**: criteria combineren.\n- Zakelijke vs. vakantiereizigers onderscheid je **gedragsmatig** (reden en moment van reizen).\n- Psychografisch is **moeilijker** dan demografisch, omdat waarden en levensstijl niet direct zichtbaar of meetbaar zijn." },
    { kop: "Targeting", md: "- **Undifferentiated**: één aanbod voor de hele markt (massamarketing).\n- **Differentiated**: verschillende aanbiedingen voor meerdere segmenten.\n- **Concentrated**: focus op één segment (niche). Past bij een starter met weinig middelen. Risico: alles hangt af van één segment.\n- **Micromarketing**: afstemmen op lokale groepen of individuen (hyperpersonalisatie).\n\nKeuzefactoren: middelen en budget, het product, de fase in de levenscyclus, de markt en de concurrentie. Louis Vuitton richt zich met een exclusief aanbod op een kleine, kapitaalkrachtige groep." },
    { kop: "Positionering", md: "- **Positionering** = een onderscheidend beeld creëren in de geest van de doelgroep, ten opzichte van concurrenten.\n- **USP** (unique selling point): het unieke voordeel dat je onderscheidt.\n- Positioneringsstrategieën: op **productattribuut** (Volvo: veiligheid), op **voordeel**, op **prijs-kwaliteit**, op **gebruiker** (voor gezinnen), op gebruiksmoment of ten opzichte van een concurrent.\n- **Repositionering**: de positie aanpassen als de markt verandert.\n- **Merkidentiteit** is wie het merk wil zijn; **positionering** is de externe vertaling daarvan in het hoofd van de klant." },
    { kop: "Positioneringskaart", md: "- Twee assen met **relevante attributen** (bv. prijs laag–hoog en doelgroep breed–niche), daarop de merken.\n- Je ziet waar concurrenten zitten en waar **witte vlekken** liggen: posities die niemand bedient. Een witte vlek is een kans, mits er vraag is.\n- Voor smartphones kun je bv. prijs en gebruiksgemak of prijs en camerakwaliteit nemen." },
    { kop: "De positioneringsverklaring", md: "Structuur: **Voor [doelgroep] is [merk] de [categorie] die [voordeel] biedt, omdat [bewijs].**\n\nVoorbeeld met de casusgegevens: *Voor studenten en young professionals in middelgrote steden is GreenRide de elektrische deelscooter die je snel en duurzaam door de stad brengt, omdat de accu 30% langer meegaat en met 100% zonne-energie wordt geladen.*\n\nDe verklaring is intern het **kompas voor de marketingmix** (prijs, kanalen en boodschap moeten erbij passen). De **merkbelofte** is wat je extern aan klanten belooft." }
  ],
  stelling: null },

{ n: 5, titel: "Producten en diensten", sub: "Value creation: producten en diensten", boek: "H6 Creating Value: Products and Services",
  lesdoelen: ["Beschrijven welke rol producten en diensten spelen binnen de marketingmix.", "Uitleggen hoe productniveaus bijdragen aan klantwaarde.", "Herkennen hoe productportfolio, innovatie en productontwikkeling invloed hebben op marketingkeuzes.", "Uitleggen hoe de product life cycle invloed heeft op marketingactiviteiten."],
  kern: [
    { kop: "De drie niveaus van een product", md: "1. **Kernproduct**: het basisvoordeel, de behoefte die wordt vervuld. Hotelkamer: een goede nachtrust. Smartphone: verbonden zijn.\n2. **Werkelijk (tastbaar) product**: de fysieke kenmerken: ontwerp, kwaliteit, merk, verpakking. Hotel: kamer, bed, badkamer.\n3. **Uitgebreid product**: extra's en service: garantie, levering, klantenservice. Hotel: ontbijt, wifi, roomservice.\n\nElk niveau voegt klantwaarde toe. Onderscheiden lukt vaak het best op het **derde niveau**." },
    { kop: "Diensten: de vier IHIP-kenmerken", md: "| Kenmerk | Betekenis | Hoe ga je ermee om? |\n|---|---|---|\n| **Intangibility** | immaterieel, niet vooraf te zien of voelen | tastbaar maken: reviews, diploma's aan de muur, nette praktijk (tandarts) |\n| **Heterogeneity** | kwaliteit verschilt per levering | standaardiseren, training, protocollen |\n| **Inseparability** | productie en consumptie gebeuren tegelijk | personeel is onderdeel van de dienst |\n| **Perishability** | niet op te slaan | reserveringen, dynamische prijzen en yield management (hotel) |\n\nDeze kenmerken zijn de reden voor de extra P's (People, Process, Presence)." },
    { kop: "De productlevenscyclus (PLC)", md: "1. **Introductie**: lage omzet, hoge kosten. Doel: bekendheid opbouwen.\n2. **Groei**: stijgende omzet, er komen concurrenten bij. De elektrische auto zit nu in deze fase.\n3. **Volwassenheid**: stabiele omzet, hevige concurrentie en prijsdruk. Onderscheiden en vernieuwen.\n4. **Neergang**: dalende omzet, het product veroudert. Strategie: afbouwen, kosten verlagen, oogsten, herpositioneren of uit de markt halen.\n\nDe fase bepaalt de marketingmix: in de introductiefase draait communicatie om bekendheid, in de volwassenheid om onderscheid en klantbinding." },
    { kop: "Nieuwe productontwikkeling (NPD)", md: "1. Ideeëngeneratie\n2. Ideeënselectie\n3. Conceptontwikkeling en -test\n4. Marketingstrategie en businessanalyse\n5. Productontwikkeling en **markttest** (in een beperkte markt meten hoe consumenten reageren)\n6. **Commercialisering**: de lancering, de duurste stap\n\nVeel nieuwe producten mislukken door **onvoldoende marktonderzoek, slechte timing of te weinig onderscheid**." },
    { kop: "Assortimentsstrategie", md: "- **Breedte**: aantal productlijnen (een supermarkt: zuivel, brood, groente …).\n- **Diepte**: aantal varianten per lijn (Douwe Egberts: verschillende smaken en vormen koffie).\n- **Lengte**: totaal aantal producten.\n- **Consistentie**: hoe goed de lijnen bij elkaar passen.\n\nHet assortiment moet passen bij de positionering. Een breed assortiment trekt meer klanten, maar kost meer en kan het merk vaag maken." },
    { kop: "Verpakking, labeling en kwaliteit", md: "- **Verpakking**: bescherming, communicatie en beleving (bij parfum is de verpakking een groot deel van de waarde).\n- **Labeling**: informatie en wettelijke eisen.\n- **Functionele kwaliteit**: doet het product objectief wat het moet doen? **Waargenomen kwaliteit**: hoe de klant de kwaliteit ervaart.\n- **TQM** (Total Quality Management): de hele organisatie werkt continu aan kwaliteit. **ISO**: internationale normen en certificering.\n- Duurzame verpakking hoort bij maatschappelijke verantwoordelijkheid." }
  ],
  stelling: "Een breed assortiment is beter dan een smal assortiment, omdat je meer klanten aanspreekt." },

{ n: 6, titel: "Prijsstrategie", sub: "Prijs, prijsstrategieën en prijstactieken", boek: "H7 Offering Value: Price",
  lesdoelen: ["Beschrijven welke rol prijs speelt binnen de marketingmix.", "Uitleggen hoe prijs samenhangt met klantwaarde, kwaliteit en positionering.", "Herkennen welke factoren invloed hebben op prijsstelling, zoals kosten, concurrentie en klantwaarde.", "Uitleggen hoe verschillende prijsstrategieën en prijstactieken kunnen bijdragen aan organisatiedoelstellingen."],
  kern: [
    { kop: "Wat bepaalt de prijs?", md: "- **Interne factoren**: kosten, doelstellingen, de rest van de marketingmix.\n- **Externe factoren**: vraag, concurrentie, wetgeving.\n- **Prijsdoelstellingen**: winst, marktaandeel of overleven.\n- **Prijs als kwaliteitssignaal**: een te lage prijs kan een merk goedkoop laten lijken.\n- In de **digitale economie** zijn prijzen transparant (vergelijkingssites) en kunnen ze snel veranderen." },
    { kop: "Drie prijszettingsmethoden", md: "| Methode | Uitgangspunt | GreenRide B2B |\n|---|---|---|\n| **Cost-based** | kosten + opslag | kosten €65 per maand |\n| **Competition-based** | prijs van concurrenten | concurrenten ±€89 per maand |\n| **Value-based** | waarde voor de klant, wat hij wil betalen | klant betaalt tot €110 bij perfecte service |\n\nValue-based is moeilijker dan cost-based, omdat je moet onderzoeken wat de klant de waarde vindt. Kosten weet je zelf." },
    { kop: "Generieke prijsstrategieën", md: "- **Afroomprijs (skimming)**: hoog beginnen en de vroege kopers 'afromen'. Past bij nieuwe luxe of innovatieve producten.\n- **Penetratieprijs**: laag beginnen om snel marktaandeel te winnen.\n- **Concurrentiegericht**: rond de prijs van de concurrent.\n- **Waardeprijsstrategie**: de prijs afstemmen op de waarde die de klant ervaart." },
    { kop: "Prijselasticiteit", md: "**Prijselasticiteit = % verandering gevraagde hoeveelheid ÷ % verandering prijs**\n\n- **Elastisch** (|E| > 1): de vraag reageert sterk op de prijs. Voorbeeld: bioscoopbezoek, er zijn veel alternatieven.\n- **Inelastisch** (|E| < 1): de vraag reageert weinig. Voorbeeld: medicijnen, je hebt ze nodig en er is geen alternatief.\n- Factoren: alternatieven, noodzaak, aandeel in het budget, merktrouw.\n\nRekenvoorbeeld: prijs +10%, vraag −20% → E = −20 / 10 = **−2** → elastisch. Bij elastische vraag kan een prijsverlaging de omzet verhogen." },
    { kop: "Kostprijs, marktprijs en break-even", md: "- **Kostprijs**: wat één product kost om te maken of te leveren. **Marktprijs**: de prijs die in de markt gangbaar is.\n- **Break-evenpunt**: de afzet waarbij omzet gelijk is aan de totale kosten. **BEP (aantal) = vaste kosten ÷ (prijs − variabele kosten per stuk)**." },
    { kop: "Prijstactieken", md: "Concrete instrumenten om de prijs te variëren en klanten te stimuleren:\n- **Kortingen**: kwantum, seizoen, loyaliteit.\n- **Bundelprijs**: meerdere producten samen voor een lagere totaalprijs.\n- **Freemium**: basisversie gratis, premium functies betaald.\n- **Psychologische prijs**: €9,99 voelt als €9, want klanten lezen het eerste cijfer.\n- **Prijsgarantie**.\n- **Prijsdiscriminatie**: verschillende prijzen voor verschillende segmenten (studententarief). Dit is legaal; illegale prijsafspraken zijn iets anders." },
    { kop: "Dynamische prijsstelling", md: "- **Dynamische prijsstelling**: prijzen variëren op basis van vraag, tijd, locatie en klantprofiel.\n- **Yield management**: omzet optimaliseren door prijs en capaciteit af te stemmen op de vraag (vliegtuigen, hotels, Uber surge pricing).\n- Voordelen: hogere omzet, betere benutting van capaciteit. Nadelen: ontevreden klanten bij grote prijsverschillen.\n- In de digitale economie: gepersonaliseerde prijzen, abonnementen (SaaS), freemium, pay-per-use. Prijsstrategie wordt **flexibeler en data-gedrevener**." }
  ],
  stelling: "Dynamische prijsstelling is oneerlijk tegenover consumenten." },

{ n: 7, titel: "Distributiestrategie", sub: "Distributiekanalen, omnichannel en e-commerce", boek: "H8 Distributing Value: Place",
  lesdoelen: ["Beschrijven welke rol distributie speelt binnen de marketingmix.", "Herkennen welke distributiekanalen een organisatie kan gebruiken om klanten te bereiken.", "Uitleggen hoe directe en indirecte distributie bijdragen aan klantwaarde.", "Uitleggen hoe digitale distributiekanalen invloed hebben op bereik, gemak en klantbeleving."],
  kern: [
    { kop: "Distributiekanalen", md: "- **Distributiekanaal**: de weg van producent naar consument.\n- **Direct kanaal**: producent → consument (eigen winkel, eigen webshop, app).\n- **Indirect kanaal**: producent → tussenpersonen → consument. Tussenpersonen: **groothandel**, **detailhandel** (winkels), **agent**.\n- Hermès verkoopt exclusief via eigen winkels: volledige controle over de merkbeleving. Een kleine producent verkoopt via Bol.com voor bereik, vertrouwen en logistiek." },
    { kop: "Distributiestrategieën", md: "| Strategie | Wat | Past bij |\n|---|---|---|\n| **Intensief** | zoveel mogelijk verkooppunten | gemaksproducten: Red Bull, frisdrank |\n| **Selectief** | geselecteerde verkooppunten | merkkleding, elektronica |\n| **Exclusief** | heel weinig, exclusieve verkooppunten | luxe: Chanel, Hermès |\n\nDe keuze hangt af van het product, de **positionering**, de gewenste controle en de kosten." },
    { kop: "Logistiek en supply chain", md: "- **Supply chain**: de keten van grondstof tot consument.\n- **Logistiek**: transport, opslag, voorraadbeheer.\n- **Just-in-time (JIT)**: precies op tijd leveren met minimale voorraad. Risico: bij een verstoring staat alles stil. **Lean**: verspilling eruit.\n- **Duurzame logistiek** (elektrisch vervoer, minder ritten) en **digitalisering** (tracking, voorspellen)." },
    { kop: "Multichannel vs. omnichannel", md: "- **Multichannel**: meerdere kanalen naast elkaar, die los van elkaar werken.\n- **Omnichannel**: alle kanalen **naadloos geïntegreerd**, met de klantervaring als uitgangspunt. Winkel, webshop en app vormen één geheel (één klantprofiel, online bestellen en in de winkel ophalen of retourneren).\n- **Click & collect**: online bestellen, ophalen in de winkel.\n- Grootste uitdaging: **technologische integratie van systemen en data**." },
    { kop: "E-commerce en digitale platforms", md: "- E-commerce: **B2C, B2B, C2C** (consumenten onderling).\n- **Marktplaatsen/platforms**: Amazon, Bol.com, Alibaba.\n- **Direct-to-consumer (D2C)**: het merk verkoopt zelf online. Voordelen: hogere marge, eigen klantdata, directe klantrelatie.\n- **Social commerce**: kopen via sociale media (bv. in een Instagram- of TikTok-shop)." },
    { kop: "Retailmarketing en shopper marketing", md: "- **Retailmarketing**: marketing door en voor retailers.\n- **Shopper marketing**: koopbeslissingen beïnvloeden **op het verkooppunt** (displays, schappen, in-store promoties).\n- **Category management**: het assortiment per productcategorie beheren.\n- **Winkelindeling** stuurt koopgedrag (looproute, basisproducten achterin).\n- **Digitale shopper marketing**: apps en beacons in de winkel." }
  ],
  stelling: null },

{ n: 8, titel: "Marketingcommunicatie en IMC", sub: "Marketingcommunicatiemix, IMC en digitale marketing", boek: "H9 Communicating Value: Promotion",
  lesdoelen: ["Beschrijven welke rol promotie speelt binnen de marketingmix.", "Herkennen uit welke onderdelen de promotional mix bestaat.", "Uitleggen hoe organisaties via communicatie waarde overbrengen aan klanten.", "Uitleggen hoe integrated marketing communication bijdraagt aan consistente klantcommunicatie."],
  kern: [
    { kop: "De marketingcommunicatiemix", md: "| Instrument | Wat |\n|---|---|\n| **Reclame** | betaalde boodschap via media (tv, online ads, posters) |\n| **Sales promotion** | tijdelijke prikkel: korting, actie, gratis proefrit |\n| **Public relations (PR)** | relatie met publiek en media, reputatie |\n| **Persoonlijke verkoop** | één-op-één contact |\n| **Direct marketing** | direct, persoonlijk en meetbaar contact (e-mail, post) |\n| **Digitale / social media** | online kanalen, social, content |\n\nDe **hoogste geloofwaardigheid** heeft PR (earned media), omdat het niet als reclame voelt. Bij een **luxemerk** passen persoonlijke verkoop, PR en events." },
    { kop: "Integrated Marketing Communications (IMC)", md: "- **IMC**: alle instrumenten en kanalen brengen **één consistente boodschap**. Dat zorgt voor herkenning, vertrouwen en efficiëntie.\n- **Paid media**: betaald (advertenties). **Owned media**: eigen kanalen (website, app, eigen socials). **Earned media**: verdiend (reviews, pers, shares).\n- **AIDA-model**: Attention → Interest → Desire → Action. In de **Attention-fase** passen reclame, social ads, posters en PR.\n- IMC volgt de **customer journey**: per fase andere middelen." },
    { kop: "Reclame en public relations", md: "- **Reclame**: doelen zijn informeren, overtuigen of herinneren. Planning: doelgroep, boodschap, medium, budget. In de introductiefase is het doel vooral **informeren en bekendheid**.\n- **PR**: earned media en reputatiemanagement.\n- **Crisis-PR**: snel reageren, eerlijk en empathisch, verantwoordelijkheid nemen, de oplossing laten zien, één woordvoerder.\n- **Sponsoring en evenementen** moeten passen bij de positionering." },
    { kop: "Digitale marketing", md: "- **SEO**: je website optimaliseren voor **organische** (gratis) zoekresultaten.\n- **SEA**: **betaalde** advertenties in zoekmachines.\n- **GEO** (Generative Engine Optimization): zorgen dat AI-assistenten jouw merk noemen in hun antwoorden.\n- **E-mailmarketing**: gepersonaliseerd, meetbaar en goedkoop. Toestemming is wel nodig (AVG).\n- **Display advertising en retargeting**: retargeting = advertenties tonen aan mensen die je website al eerder bezochten.\n- Alles is **data-gedreven** en meetbaar." },
    { kop: "Social media en influencers", md: "- Platforms: Instagram, TikTok, LinkedIn, YouTube. **Organisch** bereik (gratis) vs. **betaald** bereik.\n- **Micro-influencers** (kleiner publiek) zijn vaak geloofwaardiger, hebben meer betrokken volgers en zijn goedkoper. **Macro-influencers** hebben groot bereik.\n- **User-generated content (UGC)**: content gemaakt door gebruikers. Waardevol omdat het geloofwaardig en gratis is.\n- Social media strategie: doelstelling, doelgroep, content." },
    { kop: "Content marketing en inbound", md: "- **Content marketing**: waardevolle content maken en delen om een doelgroep aan te trekken.\n- **Inbound**: de klant komt naar jou toe (blogs, video's). **Outbound**: jij benadert de klant (reclame, cold calling).\n- **Content marketing funnel**: van bekendheid naar overweging naar conversie en loyaliteit.\n- Vormen: blogs, video, podcasts, infographics. Meten met **KPI's**: bereik, engagement, klikratio, conversie." }
  ],
  stelling: null },

{ n: 9, titel: "Branding en customer experience", sub: "Merkidentiteit, brand equity, CX en klantloyaliteit", boek: "H11 Maintaining Value: Branding and Brand Management",
  lesdoelen: ["Beschrijven welke rol People, Process en Presence spelen binnen de uitgebreide marketingmix.", "Uitleggen hoe dienstenmarketing en customer experience bijdragen aan klantwaarde.", "Herkennen hoe de 7P's samenhangen binnen een eenvoudige marketingcasus.", "Onderbouwen welke marketingkeuzes passend zijn binnen een eenvoudige casus op basis van marketingconcepten."],
  kern: [
    { kop: "Merkidentiteit en merkpersoonlijkheid", md: "- **Merk**: naam, symbool, ontwerp of een combinatie die de aanbieder onderscheidt.\n- **Merkidentiteit**: wat het merk wil uitstralen (de zender). **Merkimago**: hoe de klant het merk werkelijk ziet (de ontvanger).\n- **Merkpersoonlijkheid**: menselijke eigenschappen van een merk (IKEA: praktisch, nuchter, toegankelijk).\n- **Merkwaarden**: de kernwaarden. **Merkbelofte**: wat het merk de klant belooft." },
    { kop: "Brand equity en Keller's CBBE-model", md: "**Brand equity** = de (extra) waarde van een merk. Apple heeft een hogere brand equity dan een onbekend merk door bekendheid, sterke associaties en loyale klanten.\n\n**Keller's Customer-Based Brand Equity-piramide**, van onder naar boven:\n1. **Identiteit**: wie ben je? (merkbekendheid)\n2. **Betekenis**: wat ben je? (prestaties en imago, merkassociaties)\n3. **Respons**: wat vind ik van je? (oordelen en gevoelens)\n4. **Resonantie**: wat is onze relatie? (loyaliteit, binding, actieve betrokkenheid)\n\n**Merktrouw**: je blijft het merk kopen. **Merkadvocacy**: je beveelt het merk actief aan anderen aan." },
    { kop: "Merkarchitectuur", md: "- **Branded house**: één merk over alle producten (Google, Virgin).\n- **House of brands**: veel losse merken onder één bedrijf. **Unilever**: Dove, Axe, Hellmann's, Domestos.\n- **Merkextensie**: de merknaam gebruiken in een nieuwe categorie. Risico: verwatering van het merk en imagoschade bij een flop.\n- **Co-branding**: twee merken werken samen in één aanbod.\n- **Private labels / huismerken**: merken van de retailer zelf." },
    { kop: "Customer experience (CX)", md: "- **CX** = de **totale beleving** van de klant over alle touchpoints heen.\n- **Klanttevredenheid** is een momentopname; **CX** is de opgetelde beleving.\n- **Functionele CX** (snel, makkelijk, werkt het?) vs. **emotionele CX** (hoe voelt het?).\n- Een goede CX is een **concurrentievoordeel**." },
    { kop: "Klantloyaliteit en NPS", md: "- **Loyaliteit**: **attitudinaal** (positieve houding, voorkeur) en **gedragsmatig** (herhaalaankopen). Loyaliteitsprogramma's versterken dit.\n- **Net Promoter Score (NPS)**: \"Hoe waarschijnlijk is het dat je ons aanbeveelt?\" (0–10). **Promoters** 9–10, **passives** 7–8, **detractors** 0–6.\n- **NPS = % promoters − % detractors** (van −100 tot +100).\n- **CLV** is een betere maatstaf dan de omzet per transactie, omdat het de waarde van de hele relatie laat zien.\n- **AI-ethiek**: personalisatie met klantdata kan te ver gaan (privacy, manipulatie)." },
    { kop: "CX-management en service design", md: "- **Touchpoint mapping**: alle contactmomenten in kaart.\n- **Service design**: diensten systematisch ontwerpen voor een optimale klantervaring.\n- **Service blueprint**: processen en interacties zichtbaar maken (wat de klant ziet en wat erachter gebeurt).\n- **Moments of truth**: cruciale contactmomenten. Voor GreenRide: een scooter vinden, ontgrendelen en veilig aankomen.\n- **CX meten**: **NPS** (aanbevelen), **CSAT** (tevredenheid over een specifiek contact), **CES** (customer effort score: hoeveel moeite het de klant kostte)." },
    { kop: "De extra P's van dienstenmarketing", md: "- **People**: medewerkers en klantcontact. Bij diensten zijn mensen deel van het product.\n- **Process**: hoe de dienst wordt geleverd (stappen, wachttijd, de flow in de app).\n- **Presence**: de fysieke en digitale aanwezigheid en uitstraling: waar en hoe de klant je ziet (elders *Physical evidence*: tastbaar bewijs zoals inrichting, website, uniform)." }
  ],
  stelling: null },

{ n: 10, titel: "Marketingstrategie en marketingplan", sub: "Analyse, strategie, SMART, KPI's en het marketingplan", boek: "H12 Managing Value: Analytics and Marketing Performance Measurement + H5 Marketing Strategy",
  lesdoelen: ["Herkennen welke rol merken spelen bij het creëren van klantwaarde.", "Benoemen welke elementen bijdragen aan brand equity, zoals merkbekendheid en merkassociaties.", "Herkennen hoe branding samenhangt met positionering en klantbeleving.", "Beschrijven hoe customer experience en branding bijdragen aan waardecreatie op lange termijn."],
  kern: [
    { kop: "Marketinganalyse", md: "- **SWOT**: interne en externe analyse.\n- **PESTEL**: macro-omgeving.\n- **Porter's Five Forces**: concurrentieanalyse.\n- **Klantenanalyse**: segmentatie en klantprofiel.\n- **Integratie**: van data naar inzicht. De analyses samen bepalen de strategie." },
    { kop: "Marketingstrategie", md: "- Van **analyse naar actie**.\n- **Generieke strategieën** (Porter): kostenleiderschap, differentiatie, focus.\n- **Groeistrategieën**: Ansoff-matrix. Uitbreiden naar andere steden met dezelfde dienst = **marktontwikkeling**.\n- **Concurrentiestrategie**: **aanvaller** (valt de marktleider aan), **verdediger** (marktleider verdedigt zijn positie), **nicher** (richt zich op een niche).\n- De marketingmix moet de gekozen strategie ondersteunen." },
    { kop: "SMART-doelstellingen, KPI's en ROI", md: "- **SMART**: Specifiek, Meetbaar, Acceptabel, Realistisch, Tijdgebonden.\n- Soorten doelstellingen: omzet, marktaandeel, merkbekendheid, klanttevredenheid.\n- Voorbeeld: *Uiterlijk drie maanden na de lancering in Utrecht heeft GreenRide 5.000 actieve gebruikers onder studenten en young professionals.*\n- **Doelstelling** = wat je wilt bereiken. **KPI** = de meetbare indicator waarmee je de voortgang volgt (aantal actieve gebruikers per maand).\n- **ROI / ROMI** (rendement op marketing) = (opbrengst door marketing − marketingkosten) ÷ marketingkosten × 100%." },
    { kop: "Opbouw van een marketingplan", md: "1. **Samenvatting** (executive summary): schrijf je als laatste, maar staat voorop. De lezer ziet meteen de kern.\n2. **Situatieanalyse**: SWOT, PESTEL, concurrentie. De basis van het plan.\n3. **Marketingdoelstellingen**: SMART.\n4. **Marketingstrategie**: STP, generieke strategie.\n5. **Marketingmix**: 7P's.\n6. **Budget en planning**.\n7. **Evaluatie en controle**: meten en bijstellen als doelen niet gehaald worden.\n\nDe onderdelen moeten **consistent** zijn (een rode draad). Inconsistentie leidt tot verwarring en inefficiëntie." },
    { kop: "Marketingbudget", md: "Bekende methoden om een budget te bepalen:\n- **Taakstellend** (objective-and-task): wat is nodig om de doelen te halen? Past goed bij een start-up met heldere doelen.\n- **Percentage van de omzet**: lastig zonder omzet (start-up).\n- **Concurrentiegericht**: evenveel als concurrenten uitgeven.\n- **Wat je kunt missen** (affordable): wat overblijft.\n\nVerdeel het budget over activiteiten en meet met KPI's (kosten per nieuwe gebruiker, conversie, ROI)." },
    { kop: "Marketingcontrole en evaluatie", md: "- **Meten en bijsturen**.\n- Soorten controle: **jaarplancontrole** (halen we de jaardoelen?), **winstgevendheidscontrole** (welke producten, klanten of kanalen zijn winstgevend?), **efficiëntiecontrole** (hoe efficiënt zijn onze instrumenten?), **strategische controle** (klopt de strategie nog?).\n- **Marketingaudit**: een grondige, periodieke doorlichting van de hele marketing.\n- **Dashboards en rapportages**.\n- **Agile marketing**: in korte cycli testen en snel bijsturen op basis van data. Belangrijk in digitale marketing, omdat je resultaten direct ziet." }
  ],
  stelling: null },

{ n: 11, titel: "Herhaling en eindpresentatie", sub: "Herhaling, toetsvoorbereiding en eindpresentaties", boek: "Alles herhalen",
  lesdoelen: ["Herhalen en benoemen van de kernbegrippen van marketing, klantwaarde en de marketingmix.", "Herkennen van de samenhang tussen de onderdelen van de module."],
  kern: [
    { kop: "Recap-vragen uit de les", md: "- *Een bedrijf heeft een sterk merk en de vraag naar duurzame producten groeit.* Het sterke merk is een **sterkte** (intern), de groeiende vraag een **kans** (extern).\n- *De overheid voert strengere regels in voor CO₂-uitstoot.* Dit is een PESTEL-factor (**Legal**, met een **Ecological** oorzaak). Voor GreenRide is het een kans: uitstootvrij vervoer wordt aantrekkelijker.\n- *GreenRide krijgt steeds meer concurrenten met vergelijkbare e-fietsen.* Dit analyseer je met **Porter's Five Forces**: concurrentie tussen bestaande aanbieders (en dreiging van nieuwe toetreders)." },
    { kop: "Eindpresentatie marketingplan", md: "- **Onderwerp**: marketingplan.\n- **Verplichte onderdelen**: situatieanalyse, STP, marketingmix (7P's), SMART-doelstellingen.\n- **Beoordelingscriteria**: inhoud, onderbouwing, presentatie, samenwerking.\n- Zorg voor een **duidelijke rode draad**.\n- **Presentatietijd: 13 minuten per groep.**" },
    { kop: "Samenhang van de module", md: "Analyse (LW02–03) → keuzes (STP, LW04) → marketingmix (product LW05, prijs LW06, plaats LW07, promotie LW08, people/process/presence en merk LW09) → plan, doelen en meten (LW10).\n\nIn het casetentamen pas je deze lijn toe op een casus: analyseer, kies, onderbouw met begrippen en geef advies." }

function mastery(n) {
  const t = termsOf(n), q = quizOf(n).concat((S.extraQ || []).filter(x => x.w === n));
  const known = t.filter(b => (S.cards[b.id]?.box || 0) >= 2).length;
  const cardP = t.length ? known / t.length : 0;
  if (!q.length) return Math.round(cardP * 100);
  const right = q.filter(x => S.quiz[x.id] === 1).length;
  return Math.round((cardP * .5 + right / q.length * .5) * 100);
}

function md(text) {
  let html;
  if (window.marked && window.DOMPurify) {
    try { html = DOMPurify.sanitize(marked.parse(String(text || ""), { gfm: true, breaks: false })); } catch { html = null; }
  }
  if (html == null) html = "<p>" + esc(text).replace(/\n\n+/g, "</p><p>").replace(/\n/g, "<br>") + "</p>";
  return html.replace(/<table>/g, '<div class="tw"><table>').replace(/<\/table>/g, "</table></div>").replace(/⟦([^⟧]+)⟧/g, '<span class="vul">$1</span>');
}

let DOCX_P = null;
function loadDocx() {
  if (window.docx) return Promise.resolve(window.docx);
  if (!DOCX_P) DOCX_P = new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js";
    s.onload = () => window.docx ? res(window.docx) : rej(new Error("docx"));
    s.onerror = () => { DOCX_P = null; rej(new Error("docx")); };
    document.head.appendChild(s);
  });
  return DOCX_P;
}
const decode = s => String(s || "").replace(/&amp;/g, "&").replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&quot;/g, '"').replace(/&#39;/g, "'");
function mdToDocx(D, title, text) {
  const runs = (toks, f = {}) => {
    const out = [];
    for (const t of toks || []) {
      if (t.type === "strong") out.push(...runs(t.tokens, { ...f, bold: true }));
      else if (t.type === "em") out.push(...runs(t.tokens, { ...f, italics: true }));
      else if (t.type === "del") out.push(...runs(t.tokens, { ...f, strike: true }));
      else if (t.type === "codespan") out.push(new D.TextRun({ text: decode(t.text), font: "Consolas", ...f }));
      else if (t.type === "br") out.push(new D.TextRun({ text: "", break: 1 }));
      else if (t.type === "link") out.push(...runs(t.tokens, f));
      else if (t.type === "text" && t.tokens) out.push(...runs(t.tokens, f));
      else out.push(new D.TextRun({ text: decode(t.text ?? t.raw ?? "").replace(/⟦|⟧/g, ""), ...f }));
    }
    return out;
  };
  const H = [D.HeadingLevel.HEADING_1, D.HeadingLevel.HEADING_2, D.HeadingLevel.HEADING_3, D.HeadingLevel.HEADING_4];
  const blocks = (toks, out, lvl = 0) => {
    for (const t of toks) {
      if (t.type === "heading") out.push(new D.Paragraph({ heading: H[Math.min(t.depth, 4) - 1], children: runs(t.tokens), spacing: { before: 240, after: 100 } }));
      else if (t.type === "paragraph") out.push(new D.Paragraph({ children: runs(t.tokens), spacing: { after: 120 } }));
      else if (t.type === "list") t.items.forEach((it, i) => {
        const inl = [], nested = [];
        for (const c of it.tokens) {
          if (c.type === "list") nested.push(c);
          else if (c.type === "text" || c.type === "paragraph") { if (inl.length) inl.push(new D.TextRun({ text: " " })); inl.push(...(c.tokens ? runs(c.tokens) : [new D.TextRun(decode(c.text))])); }
        }
        if (t.ordered) out.push(new D.Paragraph({ children: [new D.TextRun(((t.start || 1) + i) + ". "), ...inl], indent: { left: 360 * (lvl + 1), hanging: 280 }, spacing: { after: 60 } }));
        else out.push(new D.Paragraph({ children: inl, bullet: { level: Math.min(lvl, 3) }, spacing: { after: 60 } }));
        for (const nl of nested) blocks([nl], out, lvl + 1);
      });
      else if (t.type === "table") {
        const cell = (c, b) => new D.TableCell({ children: [new D.Paragraph({ children: runs(c.tokens, b ? { bold: true } : {}) })], margins: { top: 60, bottom: 60, left: 100, right: 100 } });
        out.push(new D.Table({ width: { size: 100, type: D.WidthType.PERCENTAGE }, rows: [new D.TableRow({ tableHeader: true, children: t.header.map(h => cell(h, true)) }), ...t.rows.map(r => new D.TableRow({ children: r.map(c => cell(c)) }))] }));
        out.push(new D.Paragraph({ text: "" }));
      }
      else if (t.type === "blockquote") { const sub = []; blocks(t.tokens, sub, lvl); sub.forEach(p => out.push(p)); }
      else if (t.type === "code") decode(t.text).split("\n").forEach(l => out.push(new D.Paragraph({ children: [new D.TextRun({ text: l, font: "Consolas" })] })));
      else if (t.type === "hr") out.push(new D.Paragraph({ text: "", border: { bottom: { color: "BBBBBB", style: D.BorderStyle.SINGLE, size: 6, space: 1 } } }));
      else if (t.type !== "space" && t.text) out.push(new D.Paragraph({ text: decode(t.text) }));
    }
  };
  const children = [new D.Paragraph({ heading: D.HeadingLevel.TITLE, children: [new D.TextRun(title)] })];
  blocks(marked.lexer(String(text || "")), children);
  return new D.Document({ creator: "Marketing Studio", title, styles: { default: { document: { run: { font: "Calibri", size: 22 } } } }, sections: [{ children }] });
}
const safeName = s => String(s || "document").replace(/[\\/:*?"<>|]+/g, "").replace(/\s+/g, " ").trim().slice(0, 80) || "document";
async function download(title, text) {
  const dl = AI.downloads;
  if (!dl) { await copyText(text); toast("Downloaden kan hier niet. De tekst staat op je klembord."); return; }
  let data, name;
  try {
    const D = await loadDocx();
    data = await D.Packer.toBlob(mdToDocx(D, title, text)); name = safeName(title) + ".docx";
  } catch { data = "# " + title + "\n\n" + text; name = safeName(title) + ".md"; }
  try { await dl.save({ filename: name, data }); toast("Opgeslagen: " + name); }
  catch (e) { if (e?.code !== "declined") toast(e?.code === "rate_limited" ? "Er staat al een download klaar. Probeer zo opnieuw." : "Downloaden lukte niet."); }
}

function aiBox(key) { return `<div class="ai-out" id="ai-${key}" ${AI.results[key] ? "" : "hidden"}>${AI.results[key] ? aiInner(key) : ""}</div>`; }
function aiInner(key) {
  const r = AI.results[key];
  if (!r) return "";
  const head = (actions) => `<div class="ai-head"><span class="ai-badge">${ICON.spark}${esc(r.label)}</span><div class="row">${actions}</div></div>`;
  if (r.state === "busy") return head(`<button class="btn sm ghost" data-act="ai-stop" data-key="${key}">Stop</button>`) + `<div class="ai-body">${r.text ? `<div class="md">${md(r.text)}</div>` : `<div class="thinking"><span class="pulse"></span>Claude denkt na. Dit kan een halve minuut duren.</div>`}</div>`;
  const acts = r.text ? `<button class="btn sm ghost" data-act="ai-copy" data-key="${key}">${ICON.copy}Kopieer</button><button class="btn sm ghost" data-act="ai-dl" data-key="${key}">${ICON.doc}Word</button>` : "";
  const redo = `<button class="btn sm ghost" data-act="ai-redo" data-key="${key}">Opnieuw</button>`;
  return head(acts + redo) + `<div class="ai-body">${r.state === "error" ? `<p class="err">${esc(r.error)}</p>` : ""}${r.text ? `<div class="md">${md(r.text)}</div>` : ""}</div>` +
    (r.truncated ? `<div class="ai-note">Het antwoord is afgebroken omdat het te lang werd. Vraag om minder tegelijk.</div>` : "") +
    (r.saved ? `<div class="ai-note">Bewaard in Mijn werk.</div>` : "");
}
function paintAI(key) { const el = document.getElementById("ai-" + key); if (el) { el.hidden = false; el.innerHTML = aiInner(key); } }

async function runAI(key, job) {
  if (!aiGuard()) return;
  AI.runs[key]?.abort();
  const ctl = new AbortController(); AI.runs[key] = ctl;
  AI.results[key] = { state: "busy", text: "", label: job.label, job };
  paintAI(key);
  document.getElementById("ai-" + key)?.scrollIntoView({ behavior: "smooth", block: "nearest" });
  let raf = 0;
  try {
    const res = await AI.sample(job.prompt, {
      signal: ctl.signal, cache: false,
      onText: ({ text }) => { AI.results[key].text = text; if (!raf) raf = requestAnimationFrame(() => { raf = 0; paintAI(key); }); }
    });
    const r = AI.results[key];
    r.state = "done"; r.text = res.text; r.truncated = res.truncated;
    if (job.save) { await Store.addWerk({ ...job.save, text: res.text }); r.saved = true; }
    paintAI(key); job.after?.(res.text);
    if (job.save) toast("Klaar en bewaard in Mijn werk");
  } catch (e) {
    const r = AI.results[key];
    if (e?.code === "cancelled") { r.state = "done"; r.text = e.text || ""; if (!r.text) delete AI.results[key]; }
    else { noteDenied(e); r.state = "error"; r.error = aiErr(e); r.text = e?.code === "refused" ? "" : (e?.text || ""); }
    if (AI.results[key]) paintAI(key); else { const el = document.getElementById("ai-" + key); if (el) { el.hidden = true; el.innerHTML = ""; } }
  } finally { cancelAnimationFrame(raf); if (AI.runs[key] === ctl) delete AI.runs[key]; }
}
