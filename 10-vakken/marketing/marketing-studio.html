Verzin geen feiten of cijfers over een casus: gebruik alleen de gegevens uit de casus. Doe je een aanname, zeg dat er dan bij.
Geef je antwoord in Markdown (koppen, opsommingen en tabellen waar dat helpt). Begin direct met de inhoud, zonder inleidend praatje en zonder afsluitende vraag.`;

function weekText(n, raw) {
  const w = week(n);
  let t = `### ${lw(n)}: ${w.titel} (${w.sub}; boek: ${w.boek})\nLesdoelen: ${w.lesdoelen.join(" ")}\n\n` + w.kern.map(k => `#### ${k.kop}\n${k.md}`).join("\n\n");
  const b = termsOf(n); if (b.length) t += "\n\nBegrippen: " + b.map(x => `${x.term}: ${x.def}`).join(" | ");
  if (raw) {
    const r = RAW.weeks[n];
    t += "\n\nLetterlijke dia-tekst " + lw(n) + ":\n" + ["A", "B"].map(k => (r[k] || []).map(s => "- " + s.l.join(" / ")).join("\n")).join("\n");
  }
  return t;
}
const lesstof = (ns, raw = true) => "LESSTOF\n" + ns.map(n => weekText(n, raw)).join("\n\n");
const cursus = () => `TENTAMEN: ${TENTAMEN.vorm}, ${TENTAMEN.duur} minuten, ${TENTAMEN.toetsing}. Stof: ${TENTAMEN.stof} Hulpmiddelen: geen.
LEERDOELEN: ${LEERDOELEN.map(l => l.n + ". " + l.t).join(" ")}
` + lesstof(WEEKS.map(w => w.n), false);
const caseText = c => `HAND-OUT (${c.lw}): ${c.titel}\nThema: ${c.thema}${c.tijd ? `\nBeschikbare tijd: ${c.tijd}` : ""}\n\nCasus:\n${c.casus}\n\nVragen:\n${c.vragen.map((v, i) => `${i + 1}. ${v}`).join("\n")}`;
const greenrideCases = () => CASES.filter(c => /GreenRide/i.test(c.titel + c.casus)).map(c => `- ${c.lw} ${c.titel}: ${c.casus.replace(/\n+/g, " ")}`).join("\n");

const P = {

TAAK: Maak een complete, sterke uitwerking van deze hand-out uit de les Marketing, zoals een student die een 8 of hoger haalt hem zou inleveren. Beantwoord elke vraag onder een eigen kop ("Vraag 1", "Vraag 2", …) en herhaal de vraag kort in cursief. Onderbouw elk antwoord met het juiste model of begrip én met concrete gegevens uit de casus. Gebruik een tabel waar dat helpt (SWOT, positioneringskaart, budgetverdeling). Sluit af met een kop "Gebruikte begrippen" met een korte lijst.

${caseText(c)}

${lesstof([c.w])}`,
  feedback: (c, ans) => `${BASIS}

TAAK: Jort heeft deze hand-out zelf beantwoord. Kijk het na als docent. Geef per vraag: een cijfer (1-10), wat goed is, wat ontbreekt of niet klopt (met het juiste begrip), en een verbeterde versie van Jorts antwoord. Wees eerlijk en concreet, en bemoedigend. Sluit af met "Tips voor het casetentamen" (maximaal 3).

${caseText(c)}

ANTWOORDEN VAN JORT:
${c.vragen.map((v, i) => `Vraag ${i + 1}: ${(ans[i] || "").trim() || "(niet beantwoord)"}`).join("\n\n")}

${lesstof([c.w])}`,
  uitleg: n => `${BASIS}

TAAK: Geef bijles over ${lw(n)} (${week(n).titel}). Leg per onderwerp de stof uit in gewone taal, geef een voorbeeld met GreenRide of een bekend merk, en noem de valkuil die studenten vaak maken. Eindig met 5 controlevragen; zet de antwoorden eronder onder een kop "Antwoorden".

${lesstof([n])}`,
  samenvatting: n => `${BASIS}

TAAK: Maak een compacte samenvatting van ${lw(n)} (${week(n).titel}) om mee te leren voor het casetentamen (maximaal één A4). Gebruik per onderwerp korte bullets met de kern, de definities die je letterlijk moet kennen, en bij elk model wanneer je het in een casus gebruikt. Sluit af met "Zo komt het in een casus terug" met 2 voorbeeldvragen.

${lesstof([n])}`,
  denkvraag: (n, q) => `${BASIS}

${lesstof([n], false)}`,

${lesstof([n], false)}`,
  begrip: b => `${BASIS}

TAAK: Leg het begrip "${b.term}" uit (lesweek ${lw(b.w)}) in maximaal 120 woorden, met een concreet voorbeeld en een ezelsbruggetje om het te onthouden. Definitie uit de les: ${b.def}`,
  quiz: (ns, k) => `${BASIS}

TAAK: Maak ${k} nieuwe meerkeuzevragen over de lesstof hieronder, met 4 antwoordopties en 1 juist antwoord. Mix kennisvragen met toepassingsvragen met een mini-casus (zoals in een casetentamen). Varieer de positie van het juiste antwoord.
Antwoord met alleen een JSON-array, zonder andere tekst: [{"vraag":"...","opties":["...","...","...","..."],"juist":0,"uitleg":"...","w":4}]
"juist" is de index (0-3) van het juiste antwoord, "uitleg" is één zin, "w" is het nummer van de lesweek.

${lesstof(ns, false)}`,
  examen: (ns) => `${BASIS}

TAAK: Maak een oefententamen in de stijl van het casetentamen Marketing (135 minuten, toepassing van marketingconcepten op één casus, geen hulpmiddelen).
Schrijf een nieuwe, realistische casus van 450-650 woorden over een fictief Nederlands bedrijf (niet GreenRide) met concrete gegevens: doelgroepen, concurrenten, cijfers, trends, prijzen, kanalen en klantreacties. Alle gegevens die nodig zijn voor de vragen staan in de casus.
Stel daarna 6 open vragen die samen de leerdoelen dekken${ns.length < 10 ? ` en vooral de stof van ${ns.map(lw).join(", ")}` : ": omgevingsanalyse/SWOT, koopgedrag of customer journey, STP en positionering, marketingmix, branding of CX, en een onderbouwd advies"}. Geef per vraag het aantal punten (samen 100) en het nummer van het leerdoel. Geef GEEN antwoorden.
Antwoord met alleen JSON, zonder andere tekst: {"titel":"...","casus":"... (Markdown mag)","vragen":[{"vraag":"...","punten":15,"leerdoel":3}]}

${cursus()}`,
  nakijken: (ex, ans) => `${BASIS}

TAAK: Kijk dit oefententamen na als examinator. Geef per vraag: behaalde punten / maximum, wat goed is, wat ontbreekt (met de juiste begrippen) en een kort modelantwoord. Eindig met: totaalscore (x/100), een cijfer (1-10, waarbij 55 punten een 5,5 is) en de 3 belangrijkste verbeterpunten met de lesweek die Jort moet herhalen (LW01-LW10).

OEFENTENTAMEN: ${ex.titel}

Casus:
${ex.casus}

${ex.vragen.map((v, i) => `Vraag ${i + 1} (${v.punten} punten): ${v.vraag}\nAntwoord van Jort: ${(ans[i] || "").trim() || "(niet beantwoord)"}`).join("\n\n")}

${cursus()}`,
  plan: () => `${BASIS}

TAAK: Dit is de praktijkopdracht "Marketingplan GreenRide". Een computervirus heeft delen van het plan vernietigd: elke plek met ⟦vul in⟧ moet worden ingevuld. Schrijf het complete marketingplan uit, met alle 11 hoofdstukken in dezelfde volgorde en met dezelfde koppen. Neem de bestaande tekst over en vul elke ⟦vul in⟧ inhoudelijk sterk in; zet de ingevulde delen **vet** zodat Jort ziet wat nieuw is (laat de tekens ⟦ en ⟧ weg).
Zorg voor een rode draad: doelgroep, positionering, SMART-doelstellingen, 4P's, customer journey (AIDA), KPI's en implementatieplan moeten op elkaar aansluiten. Gebruik waar passend gegevens uit de GreenRide-casussen van de lessen en zeg erbij dat ze daaruit komen. Let op: in dit plan gaat het om elektrische deelfietsen, in de meeste lescasussen om deelscooters.
Sluit af met een kop "Toelichting op de keuzes" (5-8 bullets) zodat Jort de keuzes kan uitleggen.

MARKETINGPLAN GREENRIDE:
${PLAN_MD}

GREENRIDE IN DE LESCASUSSEN:
${greenrideCases()}

${lesstof([3, 4, 5, 6, 7, 8, 9, 10], false)}`,
  presentatie: (filled) => `${BASIS}

Geef per dia: titel, wat er op de dia staat (maximaal 5 korte bullets), de spreektekst en de tijd in minuten. Maak 11-14 dia's die samen 13 minuten duren. Verdeel de spreekbeurten over 4 sprekers (Spreker 1-4) voor het criterium samenwerking. Eindig met 5 vragen die de docent kan stellen, elk met een goed antwoord.

${filled ? "INGEVULD MARKETINGPLAN:\n" + filled : "MARKETINGPLAN (nog niet ingevuld; maak zelf passende, onderbouwde keuzes voor de ⟦vul in⟧-plekken):\n" + PLAN_MD}

${lesstof([3, 4, 10], false)}`,
  vrij: (type, text, ns) => `${BASIS}

${({
      opdracht: "TAAK: Maak deze opdracht volledig, als eindproduct dat Jort kan inleveren (de school staat AI toe). Volg de opdracht precies en loop elk beoordelingscriterium langs dat erin staat. Gebruik de modellen uit de lesstof. Sluit af met een kop \"Zo leg je het uit\" (3-5 bullets in gewone taal) zodat Jort het kan toelichten als ernaar gevraagd wordt.",
      handout: "TAAK: Maak een nieuwe hand-out (oefencasus) in precies de stijl van de lessen: kop \"HANDOUT – CASUS\", titel, Lesweek / Dia, Thema, Complexiteit (balkjes, x/10), Beschikbare tijd, Casus (een fictief maar realistisch bedrijf, 120-200 woorden, met concrete gegevens), Opdracht met 3 vragen. Zet daarna onder een kop \"Antwoordmodel\" de complete uitwerking.",
      uitwerken: "TAAK: Werk deze opdracht of hand-out volledig uit. Beantwoord elke vraag onder een eigen kop, onderbouwd met het juiste model of begrip en met gegevens uit de tekst.",

OPDRACHT / WENS VAN JORT:
${text}

${ns.length ? lesstof(ns, ns.length <= 3) : cursus()}`

/* ===== navigatie ===== */
const NAV = [["start", "Start"], ["lesstof", "Lesstof"], ["oefenen", "Oefenen"], ["maken", "Maken"], ["tentamen", "Tentamen"], ["coach", "Coach"]];
function paintNav() {
  const cur = UI.page === "week" ? "lesstof" : UI.page === "case" ? "maken" : UI.page;
  $("#nav").innerHTML = NAV.map(([k, l]) => `<button type="button" data-act="go" data-page="${k}" ${cur === k ? 'aria-current="page"' : ""}>${ICON[k]}${l}</button>`).join("") +
    `<button type="button" data-act="go" data-page="maken" data-mtab="werk">${ICON.werk}Mijn werk <span class="muted mono" style="margin-left:auto;font-size:12px">${WERK.length || ""}</span></button>`;
  $("#tabbar").innerHTML = NAV.map(([k, l]) => `<button type="button" data-act="go" data-page="${k}" ${cur === k ? 'aria-current="page"' : ""}>${ICON[k]}<span>${l}</span></button>`).join("");
  const d = daysLeft();
  $("#mini").innerHTML = `<div class="eyebrow">Casetentamen</div>` + (d == null ? `<div class="note">Datum nog niet bekend</div>` : d > 0 ? `<b class="num">${d}</b> <span class="muted">${d === 1 ? "dag" : "dagen"} te gaan</span>` : d === 0 ? `<b>Vandaag</b>` : `<div class="note">Geweest</div>`);
  document.querySelectorAll(".theme-tg button").forEach(b => b.setAttribute("aria-pressed", String((UI.theme || "") === b.dataset.v)));
}
function applyTheme() { if (UI.theme) document.documentElement.setAttribute("data-theme", UI.theme); else document.documentElement.removeAttribute("data-theme"); }

function render() {
  paintNav();
  const page = $("#page");
  const fn = { start: pStart, lesstof: pLesstof, week: pWeek, oefenen: pOefenen, maken: pMaken, case: pCase, tentamen: pTentamen, coach: pCoach }[UI.page] || pStart;
  page.innerHTML = fn();
  after();
}
function softRender() {
  const a = document.activeElement;
  if (a && (a.tagName === "TEXTAREA" || a.tagName === "INPUT") && $("#page").contains(a)) { paintNav(); return; }
  if (Object.keys(AI.runs).length) { paintNav(); return; }
  render();
}
function go(page, extra = {}) { Object.assign(UI, { page }, extra); saveUI(); render(); window.scrollTo({ top: 0 }); }
const tabs = (name, cur, items) => `<div class="tabs" role="tablist">${items.map(([k, l]) => `<button type="button" role="tab" aria-selected="${cur === k}" data-act="tab" data-tab="${name}" data-v="${k}">${l}</button>`).join("")}</div>`;
const pill = s => `<span class="pill s${s}">${STATUS[s]}</span>`;
const wstat = n => +(S.weeks[n] || 0);
const cxMeter = c => c.complex ? `<span class="cx" aria-label="Complexiteit ${c.complex} van 10">${Array.from({ length: 10 }, (_, i) => `<i class="${i < c.complex ? "on" : ""}"></i>`).join("")}</span>` : "";

/* ===== pagina: lesstof ===== */
function pLesstof() {
  return `<header class="head"><div class="eyebrow">Lesstof</div><h1 class="title">Elf <span class="hl">lesweken</span></h1><p class="lead">Per week de kern van de dia's, de begrippen, de casussen en de originele dia-tekst. Zet een week op Beheerst als je hem kent.</p></header>
  <div class="wlist">${WEEKS.map(w => `<button class="wrow" data-act="go" data-page="week" data-n="${w.n}">
    <span class="big">${pad2(w.n)}</span>
    <span class="meta"><b class="h3">${esc(w.titel)}</b><span class="muted">${esc(w.sub)}</span><span class="note mono">${esc(w.boek)}</span></span>
    <span class="side-r">${pill(wstat(w.n))}${w.n <= 10 ? `<span class="note num">${mastery(w.n)}% gekend</span>` : ""}</span></button>`).join("")}</div>`;
}

function pWeek() {
  const n = +UI.n, w = week(n); if (!w) return pLesstof();
  const st = wstat(n), dv = denkvragen(n), cs = CASES.filter(c => c.w === n), t = termsOf(n);
  const tab = UI.wtab;
  let body = "";
  if (tab === "stof") body = `
    <div class="card"><div class="eyebrow" style="margin-bottom:8px">Lesdoelen ${lw(n)}</div><ul class="goals">${w.lesdoelen.map(g => `<li>${esc(g)}</li>`).join("")}</ul></div>
    <div class="kern">${w.kern.map(k => `<article class="card"><h3>${esc(k.kop)}</h3><div class="md">${md(k.md)}</div></article>`).join("")}</div>
    ${w.stelling ? `<div class="card stelling"><div class="eyebrow">Stelling voor de discussie</div><p class="h3" style="margin:6px 0 12px">"${esc(w.stelling)}"</p><button class="btn soft sm" data-act="ai" data-job="stelling" data-n="${n}">${ICON.spark}Argumenten voor en tegen</button></div>${aiBox("stelling-" + n)}` : ""}`;
  else if (tab === "begrippen") body = t.length ? `<div class="row"><button class="btn" data-act="practice" data-n="${n}">${ICON.cards}Oefen deze ${t.length} begrippen</button></div><dl class="gl card">${t.map(b => `<div class="gl-item"><dt>${esc(b.term)}</dt><dd>${esc(b.def)}</dd></div>`).join("")}</dl>` : `<div class="empty">Deze week heeft geen nieuwe begrippen. Herhaal de vorige weken.</div>`;

  else if (tab === "denk") body = dv.length ? `<div class="card dq">${dv.map((q, i) => `<div class="dq-item"><div class="q"><span>${esc(q)}</span><button class="btn sm soft" data-act="ai" data-job="denk" data-n="${n}" data-i="${i}" aria-label="Antwoord met AI">${ICON.spark}Antwoord</button></div>${aiBox("denk-" + n + "-" + i)}</div>`).join("")}</div>` : `<div class="empty">Geen denkvragen in deze week.</div>`;

/* ===== pagina: oefenen ===== */
let FC = { deck: [], i: 0, flip: false, key: "" };
let QZ = { set: [], i: 0, picked: null, res: [], key: "", busy: false };
const filterWeeks = () => (UI.filter && UI.filter.length ? UI.filter : WEEKS.filter(w => w.n <= 10).map(w => w.n));
const filterChips = () => `<div class="chips" role="group" aria-label="Lesweken">${[`<button class="chip" aria-pressed="${!UI.filter.length}" data-act="filter" data-v="all">Alle</button>`, ...WEEKS.filter(w => w.n <= 10).map(w => `<button class="chip" aria-pressed="${UI.filter.includes(w.n)}" data-act="filter" data-v="${w.n}">${lw(w.n)}</button>`)].join("")}</div>`;

function buildDeck() {
  const ws = filterWeeks(), key = ws.join(",");
  if (FC.key === key && FC.deck.length) return;
  const pool = BEGRIPPEN.filter(b => ws.includes(b.w));
  const byBox = k => shuffle(pool.filter(b => (S.cards[b.id]?.box || 0) === k));
  FC = { deck: [...byBox(0), ...byBox(1), ...byBox(2), ...byBox(3)], i: 0, flip: false, key };
}
function buildQuiz(force) {
  const ws = filterWeeks(), key = ws.join(",");
  if (!force && QZ.key === key && QZ.set.length) return;
  const pool = QUIZ.concat(S.extraQ || []).filter(q => ws.includes(q.w));
  const wrong = shuffle(pool.filter(q => S.quiz[q.id] === 0)), fresh = shuffle(pool.filter(q => S.quiz[q.id] == null)), right = shuffle(pool.filter(q => S.quiz[q.id] === 1));
  QZ = { set: [...wrong, ...fresh, ...right].slice(0, 10), i: 0, picked: null, res: [], key, busy: false };
}
function pOefenen() {
  const tab = UI.otab;
  let body = "";
  if (tab === "kaarten") {
    buildDeck();
    const pool = BEGRIPPEN.filter(b => filterWeeks().includes(b.w));
    const known = pool.filter(b => (S.cards[b.id]?.box || 0) >= 2).length;
    const b = FC.deck[FC.i];
    body = !b ? `<div class="empty">Geen begrippen gevonden.</div>` : `<div class="fc-wrap">
      <div class="fc-stats"><span class="num">Kaart ${FC.i + 1} van ${FC.deck.length}</span><span class="num">${known} van ${pool.length} gekend</span></div>
      <button class="fc ${FC.flip ? "flip" : ""}" data-act="flip" aria-label="Draai de kaart om">
        <span class="fc-inner">
          <span class="fc-face"><span class="tag">${lw(b.w)}</span><span class="fc-term">${esc(b.term)}</span><span class="fc-hint">Weet je wat het betekent? Tik om om te draaien.</span></span>
          <span class="fc-face back"><span class="tag">${esc(b.term)}</span><span class="fc-def">${esc(b.def)}</span></span>
        </span>
      </button>
      <div class="fc-btns"><button class="btn b0" data-act="card" data-v="0">Wist ik niet</button><button class="btn b1" data-act="card" data-v="1">Twijfel</button><button class="btn b2" data-act="card" data-v="2">Wist ik</button></div>
      <div class="row"><button class="btn sm ghost" data-act="ai" data-job="begrip" data-id="${b.id}">${ICON.spark}Leg dit begrip uit</button><button class="btn sm ghost" data-act="reshuffle">Opnieuw schudden</button></div>
      <div style="width:100%;max-width:620px">${aiBox("begrip-" + b.id)}</div>
      <p class="kbd-hint">Toetsenbord: spatie = omdraaien, 1 / 2 / 3 = wist ik niet / twijfel / wist ik</p>
    </div>`;
  } else if (tab === "quiz") {
    buildQuiz();
    const q = QZ.set[QZ.i];
    if (!QZ.set.length) body = `<div class="empty">Geen vragen voor deze weken.</div>`;
    else if (!q) {
      const ok = QZ.res.filter(Boolean).length;
      body = `<div class="card pad-lg qz"><div class="eyebrow">Resultaat</div><div class="count-big num" style="color:var(--accent-text)">${ok}<small>/ ${QZ.res.length}</small></div>
        <p class="lead">${ok === QZ.res.length ? "Alles goed. Probeer een andere week of laat AI nieuwe vragen maken." : "Fout beantwoorde vragen komen de volgende ronde als eerste terug."}</p>
        <div class="row"><button class="btn" data-act="quiznew">Nieuwe ronde</button><button class="btn ghost" data-act="ai-quiz">${ICON.spark}Maak 8 nieuwe vragen met AI</button></div><div id="qgen"></div></div>`;
    } else {
      const done = QZ.picked != null;
      body = `<div class="qz">
        <div class="progress">${QZ.set.map((_, i) => `<i class="${i < QZ.res.length ? (QZ.res[i] ? "ok" : "no") : i === QZ.i ? "cur" : ""}"></i>`).join("")}</div>
        <div class="row"><span class="tag">${lw(q.w)}</span><span class="tag">${q.bron === "extra" ? "extra oefenvraag" : q.bron === "ai" ? "gemaakt met AI" : "uit de les " + q.bron}</span></div>
        <div class="qz-q">${esc(q.vraag)}</div>
        <div class="opts">${q.opties.map((o, i) => `<button class="opt ${done ? (i === q.juist ? "ok" : i === QZ.picked ? "no" : "") : ""}" data-act="pick" data-i="${i}" ${done ? "disabled" : ""}><span class="k">${"ABCD"[i]}</span><span>${esc(o)}</span></button>`).join("")}</div>
        ${done ? `<div class="qz-fb"><b>${QZ.picked === q.juist ? "Goed!" : "Helaas."}</b> ${esc(q.uitleg || "")}</div><div class="row"><button class="btn" data-act="qnext">${QZ.i + 1 < QZ.set.length ? "Volgende vraag" : "Bekijk je score"}</button></div>` : ""}
      </div>`;
    }
    if (QZ.set[QZ.i] || !QZ.set.length) body += `<div class="row"><button class="btn sm ghost" data-act="ai-quiz">${ICON.spark}Maak 8 nieuwe vragen met AI</button><span class="note">${(S.extraQ || []).length} AI-vragen bewaard</span></div><div id="qgen"></div>`;
  } else {
    const qq = (UI.gq || "").toLowerCase();
    const list = BEGRIPPEN.filter(b => filterWeeks().includes(b.w) && (!qq || (b.term + " " + b.def).toLowerCase().includes(qq)));
    body = `<div class="field"><label for="gq">Zoek een begrip</label><input class="input" id="gq" type="search" value="${esc(UI.gq || "")}" placeholder="bijv. ZMOT, Ansoff, NPS" autocomplete="off"></div>
      <p class="note num">${list.length} begrippen</p>
      <dl class="gl card" id="glist">${glRows(list)}</dl>`;
  }
  return `<header class="head"><div class="eyebrow">Oefenen</div><h1 class="title">Stamp het <span class="hl">erin</span></h1></header>
    ${tabs("otab", tab, [["kaarten", "Flashcards"], ["quiz", "Quiz"], ["lijst", "Begrippenlijst"]])}
    ${filterChips()}
    ${body}`;
}
const glRows = list => list.map(b => `<div class="gl-item"><dt>${esc(b.term)}<span class="w">${lw(b.w)}</span></dt><dd>${esc(b.def)}</dd></div>`).join("") || `<p class="muted" style="padding:12px 0">Niets gevonden.</p>`;

/* ===== pagina: maken ===== */
const caseRow = c => `<button class="case-row" data-act="case" data-id="${c.id}"><span class="t"><span class="row"><span class="tag">${esc(c.lw)}</span>${c.handout ? "" : '<span class="tag">lescasus</span>'}${S.answers[c.id]?.some?.(a => a && a.trim()) ? '<span class="tag" style="color:var(--good)">antwoorden gestart</span>' : ""}</span><b>${esc(c.titel)}</b><span class="muted">${esc(c.thema)}</span></span>
  <span class="cx-l">${cxMeter(c)}<small>${c.complex ? `complexiteit ${c.complex}/10` : ""}${c.tijd ? (c.complex ? " · " : "") + esc(c.tijd) : ""}</small></span></button>`;
const TYPE_L = { uitwerking: "Uitwerking", feedback: "Nakijken", uitleg: "Uitleg", samenvatting: "Samenvatting", tentamen: "Oefententamen", nakijk: "Tentamen nagekeken", plan: "Marketingplan", presentatie: "Presentatie", opdracht: "Opdracht", stelling: "Discussie", denk: "Denkvraag", begrip: "Begrip" };

}

    { k: "mp", l: "Marketingplan GreenRide doorlopen: kun je elke keuze uitleggen?", go: { page: "maken", mtab: "plan" } },
    { k: "t1", l: "Oefententamen 1 (135 minuten) maken en laten nakijken", go: { page: "tentamen", ttab: "examen" } },
    { k: "zw", l: "De zwakke weken uit het nakijkadvies herhalen", go: { page: "lesstof" } },

function planHTML() {
  const tasks = planTasks(), d = daysLeft();
  const row = (task) => `<label class="ptask ${S.plan[task.k] ? "done" : ""}"><input type="checkbox" data-plan="${task.k}" ${S.plan[task.k] ? "checked" : ""}><span>${esc(task.l)} <button class="lwlink" data-act="gojson" data-go='${esc(JSON.stringify(task.go))}'>Open</button></span></label>`;
  if (d == null || d <= 0) return `<div class="plan">${tasks.map(t => `<div class="pday"><div class="d">Taak</div><div>${row(t)}</div></div>`).join("")}</div>`;
  const T = tasks.length, days = {};
  tasks.forEach((t, i) => { const di = d >= T ? Math.round(i * (d - 1) / (T - 1)) : Math.floor(i * d / T); (days[di] = days[di] || []).push(t); });
  const base = today0();
  return `<div class="plan">${Object.keys(days).map(Number).sort((a, b) => a - b).map(di => { const dt = new Date(base); dt.setDate(base.getDate() + di); return `<div class="pday"><div class="d"><b>${di === 0 ? "Vandaag" : di === 1 ? "Morgen" : esc(fmtD(dt, { weekday: "short" }))}</b>${esc(fmtD(dt, { day: "numeric", month: "short" }))}</div><div style="display:grid;gap:8px">${days[di].map(row).join("")}</div></div>`; }).join("")}</div>
  ${d > T ? `<p class="note">Op de dagen ertussen: 15 minuten flashcards.</p>` : d < T ? `<p class="note">Weinig tijd: sommige dagen hebben meerdere taken. Begin met de weken die nog niet op Beheerst staan.</p>` : ""}`;
}
function pTentamen() {

const COACH_RULES = () => `${BASIS.replace("Begin direct met de inhoud, zonder inleidend praatje en zonder afsluitende vraag.", "")}
Je bent Jorts persoonlijke studiecoach voor het casetentamen Marketing. Houd antwoorden kort (meestal onder de 200 woorden) tenzij Jort om meer vraagt. Leg uit met voorbeelden (GreenRide of bekende merken).

async function chatSend(text) {
  text = String(text || "").trim(); if (!text || CHAT.busy) return;
  if (!aiGuard()) return;
  CHAT.msgs.push({ role: "user", content: text }); CHAT.busy = true; CHAT.live = "";
  const ctl = new AbortController(); CHAT.ctl = ctl;
  render(); scrollChat();
  const turns = [{ role: "user", content: COACH_RULES() }, ...CHAT.msgs.slice(-16)];
  let raf = 0;
  try {
    const res = await AI.sample(turns, { cache: false, signal: ctl.signal, onText: ({ text }) => { CHAT.live = text; if (!raf) raf = requestAnimationFrame(() => { raf = 0; const el = $("#liveMsg"); if (el) el.innerHTML = `<div class="md">${md(CHAT.live)}</div>`; }); } });
    CHAT.msgs.push({ role: "assistant", content: res.text });
  } catch (e) {
    if (e?.code === "cancelled") { if (e.text) CHAT.msgs.push({ role: "assistant", content: e.text }); }
    else { noteDenied(e); CHAT.msgs.push({ role: "assistant", content: (e?.text ? e.text + "\n\n" : "") + "_" + aiErr(e) + "_" }); }
  } finally { cancelAnimationFrame(raf); CHAT.busy = false; CHAT.ctl = null; CHAT.live = ""; lsSet("ms-coach", CHAT.msgs.slice(-30)); if (UI.page === "coach") { render(); scrollChat(); } }
}

function cardAnswer(v) {
  const b = FC.deck[FC.i]; if (!b) return;
  const cur = S.cards[b.id]?.box || 0;
  S.cards[b.id] = { box: v === 0 ? 0 : v === 1 ? 1 : Math.min(3, Math.max(2, cur + 1)), n: (S.cards[b.id]?.n || 0) + 1 };
  Store.save();
  if (v === 0 && FC.deck.length > 3) { const [x] = FC.deck.splice(FC.i, 1); FC.deck.splice(Math.min(FC.deck.length, FC.i + 3), 0, x); }
  else FC.i = (FC.i + 1) % FC.deck.length;
  FC.flip = false; render();
}

document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.plan) { S.plan[t.dataset.plan] = t.checked; Store.save(); t.closest(".ptask")?.classList.toggle("done", t.checked); }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !$("#sheet").hidden) { closeSheet(); return; }
  if (e.target.id === "chatIn" && e.key === "Enter" && !e.shiftKey) { e.preventDefault(); chatSend(e.target.value); return; }
  if (UI.page === "oefenen" && UI.otab === "kaarten" && !/INPUT|TEXTAREA|SELECT/.test(e.target.tagName) && $("#sheet").hidden) {
    if (e.key === " " && e.target.tagName !== "BUTTON") { e.preventDefault(); FC.flip = !FC.flip; $(".fc")?.classList.toggle("flip", FC.flip); }
    else if (["1", "2", "3"].includes(e.key)) cardAnswer(+e.key - 1);
  }
});

function after() {
  if (UI.page === "coach" && CHAT.msgs.length) scrollChat();
  tickTimer();
}
function tickTimer() {
  const el = $("#timer"); if (!el || !S.exam?.start) return;
  const left = S.exam.start + 135 * 60000 - Date.now();
  if (left <= 0) { el.textContent = "Tijd is om"; el.style.color = "var(--bad)"; return; }
  const m = Math.floor(left / 60000), s = Math.floor(left / 1000) % 60;
  el.textContent = `${Math.floor(m / 60)}:${pad2(m % 60)}:${pad2(s)} over`;
}
setInterval(tickTimer, 1000);

/* ===== start ===== */
document.documentElement.lang = "nl";
applyTheme();
if (!["start", "lesstof", "week", "oefenen", "maken", "case", "tentamen", "coach"].includes(UI.page)) UI.page = "start";
if (location.hash && /^#(start|lesstof|oefenen|maken|tentamen|coach)$/.test(location.hash)) UI.page = location.hash.slice(1);
render();
(async () => {
  const C = window.claude;
  if (!C?.use) { AI.status = "uit"; render(); return; }
  Store.init();
  const [s, d] = await Promise.all([C.use("sample").catch(() => null), C.use("downloads").catch(() => null)]);
  AI.sample = s; AI.downloads = d; AI.status = s ? "klaar" : "uit";
  softRender();
})();

</script>
